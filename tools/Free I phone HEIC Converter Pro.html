<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HEIC Converter Pro</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Core Libraries -->
    <script src="https://unpkg.com/heic2any"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useCallback, useRef } = React;

        // --- Icon Components ---
        const Settings = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>;
        const UploadCloud = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"/><path d="M12 12v9"/><path d="m16 16-4-4-4 4"/></svg>;
        const FileImage = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/><polyline points="14 2 14 8 20 8"/><circle cx="10" cy="13" r="2"/><path d="m20 17-1.09-1.09a2 2 0 0 0-2.82 0L10 22"/></svg>;
        const Loader2 = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>;
        const Download = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>;
        const CheckCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>;
        const XCircle = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg>;
        const Trash2 = ({ className }) => <svg className={className} xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>;

        // --- Main App Component ---
        function App() {
            const [files, setFiles] = useState([]);
            const [outputFormat, setOutputFormat] = useState('image/jpeg');
            const [quality, setQuality] = useState(0.8);
            const [isConverting, setIsConverting] = useState(false);
            const [isZipping, setIsZipping] = useState(false);
            const fileInputRef = useRef(null);

            const handleFiles = async (newFiles) => {
                const newHeicFiles = [];
                
                for (const file of Array.from(newFiles)) {
                    if (file.name.toLowerCase().endsWith('.zip')) {
                        try {
                            const zip = new JSZip();
                            const contents = await zip.loadAsync(file);
                            
                            for (const [filename, zipEntry] of Object.entries(contents.files)) {
                                if (!zipEntry.dir && filename.toLowerCase().endsWith('.heic')) {
                                    const blob = await zipEntry.async('blob');
                                    newHeicFiles.push({
                                        id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2),
                                        file: blob,
                                        name: filename.split('/').pop() || filename,
                                        status: 'pending',
                                        progress: 0,
                                    });
                                }
                            }
                        } catch (err) {
                            console.error('Error reading zip file:', err);
                            alert(`Failed to read zip file: ${file.name}`);
                        }
                    } else if (file.name.toLowerCase().endsWith('.heic')) {
                        newHeicFiles.push({
                            id: crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).substring(2),
                            file,
                            name: file.name,
                            status: 'pending',
                            progress: 0,
                        });
                    }
                }

                setFiles(prev => [...prev, ...newHeicFiles]);
            };

            const onDrop = useCallback((e) => {
                e.preventDefault();
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFiles(e.dataTransfer.files);
                }
            }, []);

            const onFileInputChange = (e) => {
                if (e.target.files && e.target.files.length > 0) {
                    handleFiles(e.target.files);
                }
                if (fileInputRef.current) {
                    fileInputRef.current.value = '';
                }
            };

            const removeFile = (id) => {
                setFiles(prev => prev.filter(f => f.id !== id));
            };

            const clearAll = () => {
                setFiles([]);
            };

            const convertAll = async () => {
                setIsConverting(true);
                const pendingFiles = files.filter(f => f.status === 'pending' || f.status === 'error');
                
                // Dynamically import the user's original library 'heic-to' from esm.sh. 
                // This package generally has broader support for the newer iOS HEIC formats
                // compared to the older vanilla heic2any script.
                let heicToFn = null;
                try {
                    const mod = await import('https://esm.sh/heic-to@1.4.2');
                    heicToFn = mod.heicTo;
                } catch (e) {
                    console.warn("Failed to load heic-to from esm.sh, will fallback to heic2any", e);
                }

                for (const fileObj of pendingFiles) {
                    setFiles(prev => prev.map(f => f.id === fileObj.id ? { ...f, status: 'converting', progress: 0 } : f));
                    
                    try {
                        // Reconstruct a pristine Blob. Native File objects sometimes contain hidden
                        // metadata or are sliced incorrectly from drag-events, causing libheif to fail.
                        const buffer = await fileObj.file.arrayBuffer();
                        const pristineBlob = new Blob([buffer], { type: 'image/heic' });

                        let finalBlob;

                        if (heicToFn) {
                            // Use the library from the original code configuration
                            finalBlob = await heicToFn({
                                blob: pristineBlob,
                                type: outputFormat,
                                quality: quality,
                            });
                        } else {
                            // Fallback to the heic2any CDN script, handling multiple sequences (bursts) just in case
                            const resultBlob = await window.heic2any({
                                blob: pristineBlob,
                                toType: outputFormat,
                                quality: quality,
                                multiple: true
                            });
                            finalBlob = Array.isArray(resultBlob) ? resultBlob[0] : resultBlob;
                        }

                        setFiles(prev => prev.map(f => f.id === fileObj.id ? { 
                            ...f, 
                            status: 'success', 
                            progress: 100,
                            resultBlob: finalBlob 
                        } : f));

                    } catch (err) {
                        console.error(`Conversion failed for ${fileObj.name}:`, err);
                        
                        let errorMessage = 'Conversion failed. Format not supported.';
                        if (err && err.message) {
                            errorMessage = err.message;
                        } else if (typeof err === 'object') {
                            errorMessage = JSON.stringify(err);
                        }

                        setFiles(prev => prev.map(f => f.id === fileObj.id ? { 
                            ...f, 
                            status: 'error', 
                            error: errorMessage
                        } : f));
                    }
                }
                
                setIsConverting(false);
            };

            const downloadZip = async () => {
                const successfulFiles = files.filter(f => f.status === 'success' && f.resultBlob);
                if (successfulFiles.length === 0) return;

                setIsZipping(true);
                try {
                    const zip = new JSZip();
                    const extension = outputFormat === 'image/jpeg' ? 'jpg' : 'png';
                    
                    successfulFiles.forEach(fileObj => {
                        const baseName = fileObj.name.replace(/\.heic$/i, '');
                        zip.file(`${baseName}.${extension}`, fileObj.resultBlob);
                    });
                    
                    const content = await zip.generateAsync({ type: 'blob' });
                    saveAs(content, 'converted_images.zip');
                } catch (err) {
                    console.error('Error creating zip:', err);
                    alert('Failed to create zip file.');
                } finally {
                    setIsZipping(false);
                }
            };

            const downloadSingle = (fileObj) => {
                if (fileObj.status === 'success' && fileObj.resultBlob) {
                    const extension = outputFormat === 'image/jpeg' ? 'jpg' : 'png';
                    const baseName = fileObj.name.replace(/\.heic$/i, '');
                    saveAs(fileObj.resultBlob, `${baseName}.${extension}`);
                }
            };

            const anyPending = files.some(f => f.status === 'pending' || f.status === 'error');

            return (
                <div className="min-h-screen p-6">
                    <div className="max-w-4xl mx-auto space-y-8">
                        
                        <header className="text-center space-y-2 mt-8">
                            <h1 className="text-4xl font-bold tracking-tight text-slate-900">HEIC Converter Pro</h1>
                            <p className="text-slate-500">Convert bulk HEIC images or ZIP files to JPG/PNG easily.</p>
                        </header>

                        <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col sm:flex-row gap-6 items-center justify-between">
                            <div className="flex items-center gap-2 text-slate-700 font-medium">
                                <Settings className="w-5 h-5" />
                                <span>Conversion Settings</span>
                            </div>
                            <div className="flex flex-wrap items-center gap-4">
                                <div className="flex items-center gap-2">
                                    <label htmlFor="format" className="text-sm text-slate-500">Format:</label>
                                    <select 
                                        id="format"
                                        value={outputFormat}
                                        onChange={(e) => setOutputFormat(e.target.value)}
                                        className="bg-slate-50 border border-slate-200 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"
                                        disabled={isConverting}
                                    >
                                        <option value="image/jpeg">JPG</option>
                                        <option value="image/png">PNG</option>
                                    </select>
                                </div>
                                {outputFormat === 'image/jpeg' && (
                                    <div className="flex items-center gap-2">
                                        <label htmlFor="quality" className="text-sm text-slate-500">Quality: {Math.round(quality * 100)}%</label>
                                        <input 
                                            type="range" 
                                            id="quality" 
                                            min="0.1" 
                                            max="1" 
                                            step="0.1" 
                                            value={quality}
                                            onChange={(e) => setQuality(parseFloat(e.target.value))}
                                            className="w-24 accent-indigo-600"
                                            disabled={isConverting}
                                        />
                                    </div>
                                )}
                            </div>
                        </div>

                        <div 
                            onDragOver={(e) => e.preventDefault()}
                            onDrop={onDrop}
                            onClick={() => fileInputRef.current?.click()}
                            className="border-2 border-dashed border-slate-300 rounded-3xl p-12 text-center cursor-pointer hover:bg-slate-100 hover:border-indigo-400 transition-colors bg-white flex flex-col items-center justify-center gap-4"
                        >
                            <div className="w-16 h-16 bg-indigo-50 rounded-full flex items-center justify-center text-indigo-600 mb-2">
                                <UploadCloud className="w-8 h-8" />
                            </div>
                            <div>
                                <p className="text-lg font-medium text-slate-700">Click or drag files to upload</p>
                                <p className="text-sm text-slate-500 mt-1">Supports .heic images and .zip files containing HEIC</p>
                            </div>
                            <input 
                                type="file" 
                                ref={fileInputRef} 
                                onChange={onFileInputChange} 
                                className="hidden" 
                                multiple 
                                accept=".heic,.zip,application/zip,application/x-zip-compressed" 
                            />
                        </div>

                        {files.length > 0 && (
                            <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                                <div className="p-4 border-b border-slate-100 flex items-center justify-between bg-slate-50 flex-wrap gap-4">
                                    <h2 className="font-semibold text-slate-700 flex items-center gap-2">
                                        <FileImage className="w-5 h-5" />
                                        Files ({files.length})
                                    </h2>
                                    <div className="flex flex-wrap gap-2">
                                        <button 
                                            onClick={clearAll}
                                            disabled={isConverting}
                                            className="text-sm px-3 py-1.5 text-slate-600 hover:bg-slate-200 rounded-lg transition-colors disabled:opacity-50"
                                        >
                                            Clear All
                                        </button>
                                        {anyPending && (
                                            <button 
                                                onClick={convertAll}
                                                disabled={isConverting}
                                                className="text-sm px-4 py-1.5 bg-indigo-600 text-white hover:bg-indigo-700 rounded-lg transition-colors font-medium flex items-center gap-2 disabled:opacity-70"
                                            >
                                                {isConverting ? (
                                                    <><Loader2 className="w-4 h-4 animate-spin" /> Converting...</>
                                                ) : (
                                                    'Convert All'
                                                )}
                                            </button>
                                        )}
                                        {files.some(f => f.status === 'success') && (
                                            <button 
                                                onClick={downloadZip}
                                                disabled={isZipping || isConverting}
                                                className="text-sm px-4 py-1.5 bg-emerald-600 text-white hover:bg-emerald-700 rounded-lg transition-colors font-medium flex items-center gap-2 disabled:opacity-70"
                                            >
                                                {isZipping ? (
                                                    <><Loader2 className="w-4 h-4 animate-spin" /> Zipping...</>
                                                ) : (
                                                    <><Download className="w-4 h-4" /> Download ZIP</>
                                                )}
                                            </button>
                                        )}
                                    </div>
                                </div>
                                <ul className="divide-y divide-slate-100 max-h-[500px] overflow-y-auto">
                                    {files.map(file => (
                                        <li key={file.id} className="p-4 flex items-center justify-between hover:bg-slate-50 transition-colors">
                                            <div className="flex items-center gap-3 overflow-hidden">
                                                <div className="p-2 bg-slate-100 rounded-lg text-slate-500 shrink-0">
                                                    <FileImage className="w-5 h-5" />
                                                </div>
                                                <div className="truncate">
                                                    <p className="text-sm font-medium text-slate-700 truncate">{file.name}</p>
                                                    <p className="text-xs text-slate-500">
                                                        {file.status === 'pending' && 'Ready to convert'}
                                                        {file.status === 'converting' && 'Converting...'}
                                                        {file.status === 'success' && 'Converted successfully'}
                                                        {file.status === 'error' && <span className="text-red-500">{file.error}</span>}
                                                    </p>
                                                </div>
                                            </div>
                                            <div className="flex items-center gap-3 shrink-0 ml-4">
                                                {file.status === 'pending' && <span className="w-2 h-2 rounded-full bg-slate-300"></span>}
                                                {file.status === 'converting' && <Loader2 className="w-5 h-5 text-indigo-500 animate-spin" />}
                                                {file.status === 'success' && (
                                                    <>
                                                        <CheckCircle className="w-5 h-5 text-emerald-500" />
                                                        <button 
                                                            onClick={() => downloadSingle(file)}
                                                            className="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-md transition-colors"
                                                            title="Download"
                                                        >
                                                            <Download className="w-4 h-4" />
                                                        </button>
                                                    </>
                                                )}
                                                {file.status === 'error' && <XCircle className="w-5 h-5 text-red-500" />}
                                                
                                                <button 
                                                    onClick={() => removeFile(file.id)}
                                                    disabled={isConverting && file.status === 'converting'}
                                                    className="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-md transition-colors disabled:opacity-50"
                                                    title="Remove"
                                                >
                                                    <Trash2 className="w-4 h-4" />
                                                </button>
                                            </div>
                                        </li>
                                    ))}
                                </ul>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        // --- Render App ---
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
