<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keynote Motion Preset Inspector — Kinetic Typography</title>
  <style>
    :root {
      --bg-dark: #0f1013;
      --bg-panel: #181a1f;
      --bg-header: #121417;
      --border: #282c35;
      --border-focus: #0a84ff;
      --text-main: #f0f2f5;
      --text-muted: #8a919e;
      --accent: #0a84ff;
      --accent-glow: rgba(10, 132, 255, 0.25);
      --success: #30d158;
      --warning: #ffd60a;
      --headroom-teal: #4f9e91;
      --headroom-orange: #ed834e;
      --headroom-paper: #f3e4c4;
      --headroom-ink: #2e2a24;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }

    /* TOP APPLICATION HEADER */
    header {
      height: 48px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      z-index: 100;
    }
    .app-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 0.5px;
    }
    .app-badge {
      font-size: 11px;
      background: rgba(10, 132, 255, 0.15);
      color: var(--accent);
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 600;
      border: 1px solid rgba(10, 132, 255, 0.3);
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .btn {
      background: #232730;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }
    .btn:hover { background: #2c313d; border-color: #3b4252; }
    .btn:active { transform: translateY(1px); }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: white;
    }
    .btn-primary:hover { background: #0071e3; }
    .btn-success {
      background: rgba(48, 209, 88, 0.18);
      border-color: var(--success);
      color: var(--success);
    }

    /* MAIN THREE-COLUMN WORKSPACE */
    .workspace {
      flex: 1;
      display: grid;
      grid-template-columns: 290px 1fr 320px;
      height: calc(100vh - 48px);
      overflow: hidden;
    }

    /* LEFT SIDEBAR: PRESET CATALOG */
    .sidebar-left {
      background: var(--bg-panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .search-box {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }
    .search-input {
      width: 100%;
      background: #111215;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      outline: none;
    }
    .search-input:focus { border-color: var(--accent); }
    
    .preset-tree {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .category-group {
      margin-bottom: 12px;
    }
    .category-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .preset-item {
      padding: 8px 14px 8px 24px;
      font-size: 13px;
      color: #c9d1d9;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.1s ease;
      border-left: 3px solid transparent;
    }
    .preset-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
    }
    .preset-item.active {
      background: rgba(10, 132, 255, 0.12);
      color: #fff;
      border-left-color: var(--accent);
      font-weight: 600;
    }
    .tag-badge {
      font-size: 10px;
      padding: 2px 5px;
      border-radius: 3px;
      background: #252a34;
      color: #8b949e;
    }
    .tag-headroom {
      background: rgba(79, 158, 145, 0.2);
      color: #4f9e91;
      border: 1px solid rgba(79, 158, 145, 0.3);
    }
    .tag-pro {
      background: rgba(229, 169, 60, 0.2);
      color: #e5a93c;
      border: 1px solid rgba(229, 169, 60, 0.3);
    }

    /* CENTER STAGE & TIMELINE */
    .stage-area {
      background: #090a0c;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .stage-topbar {
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      border-bottom: 1px solid #1a1c22;
      background: rgba(18, 20, 23, 0.7);
    }
    .theme-picker {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .theme-select {
      background: #1e222a;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      outline: none;
    }

    .canvas-viewport {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }
    .stage-frame {
      width: 720px;
      height: 405px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 0 1px #232730;
      border-radius: 8px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.3s ease;
    }
    
    /* THEME STYLES */
    .theme-headroomPaper {
      background: var(--headroom-paper);
      color: var(--headroom-ink);
      font-family: 'Fredoka', 'Outfit', sans-serif;
    }
    .theme-headroomInk {
      background: #f7f1e3;
      color: #2e2a24;
      font-family: 'Caveat', cursive, sans-serif;
    }
    .theme-cinematicDarkRoom {
      background: #18191e;
      color: #f5f6fa;
      font-family: 'Outfit', sans-serif;
    }
    .theme-editorialInfographic {
      background: #f6f3ec;
      color: #1f2421;
      font-family: 'Poppins', sans-serif;
    }

    /* ANIMATED STAGE ELEMENTS */
    .stage-content {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      text-align: center;
      max-width: 85%;
      transform-origin: center center;
    }
    .animated-title {
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.5px;
      line-height: 1.15;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      position: relative;
    }
    .word-unit {
      display: inline-block;
      position: relative;
      transform-origin: center center;
    }
    .animated-subtitle {
      font-size: 16px;
      margin-top: 14px;
      opacity: 0.8;
      max-width: 500px;
      font-weight: 500;
    }

    /* SUPPLEMENT OVERLAYS */
    .prop-brassPin {
      position: absolute;
      top: -12px;
      left: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffd778 0%, #b8860b 70%, #5c4305 100%);
      box-shadow: 0 4px 8px rgba(0,0,0,0.35);
      z-index: 10;
    }
    .prop-pushPin {
      position: absolute;
      top: -18px;
      left: 50%;
      transform: translateX(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff5252 0%, #b71c1c 80%);
      box-shadow: 0 6px 12px rgba(0,0,0,0.4);
      z-index: 10;
    }
    .prop-washiTape {
      position: absolute;
      top: -14px;
      left: 20%;
      width: 90px;
      height: 22px;
      background: rgba(79, 158, 145, 0.45);
      backdrop-filter: blur(1px);
      transform: rotate(-3deg);
      border-left: 2px dashed rgba(255,255,255,0.4);
      border-right: 2px dashed rgba(255,255,255,0.4);
      z-index: 5;
    }
    .prop-folderTab {
      position: absolute;
      top: -24px;
      left: 14px;
      background: #d8a56b;
      color: #2e2a24;
      font-size: 10px;
      font-weight: 700;
      padding: 3px 10px 4px;
      border-radius: 4px 4px 0 0;
      letter-spacing: 0.5px;
      border: 1px solid rgba(0,0,0,0.1);
      border-bottom: none;
    }
    .prop-tokenMeter {
      margin-top: 18px;
      width: 220px;
      height: 16px;
      background: rgba(0,0,0,0.15);
      border-radius: 8px;
      padding: 2px;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(0,0,0,0.1);
    }
    .token-meter-fill {
      height: 100%;
      width: 78%;
      background: linear-gradient(90deg, #4f9e91, #ed834e);
      border-radius: 6px;
      transition: width 0.3s ease;
    }
    .prop-watercolorWash {
      position: absolute;
      inset: -10px -18px;
      background: rgba(79, 158, 145, 0.22);
      border-radius: 12px;
      filter: blur(8px);
      z-index: -1;
    }

    /* BOTTOM SCRUBBER & TIMELINE */
    .timeline-bar {
      height: 80px;
      background: var(--bg-panel);
      border-top: 1px solid var(--border);
      padding: 8px 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .timeline-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .playback-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .play-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--accent);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 13px;
    }
    .time-display {
      font-size: 12px;
      font-family: monospace;
      color: var(--text-muted);
    }
    .speed-pills {
      display: flex;
      background: #111215;
      padding: 2px;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .speed-btn {
      background: transparent;
      border: none;
      color: #8b949e;
      padding: 2px 7px;
      font-size: 11px;
      cursor: pointer;
      border-radius: 4px;
    }
    .speed-btn.active {
      background: #232730;
      color: #fff;
    }

    .scrubber-track {
      position: relative;
      height: 18px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }
    .scrubber-rail {
      height: 5px;
      width: 100%;
      background: #252a33;
      border-radius: 3px;
      position: relative;
      overflow: hidden;
    }
    .scrubber-progress {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 0%;
      background: var(--accent);
    }
    .scrubber-thumb {
      position: absolute;
      top: 50%;
      left: 0%;
      transform: translate(-50%, -50%);
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
      pointer-events: none;
    }

    /* RIGHT PANEL: KEYNOTE INSPECTOR */
    .sidebar-right {
      background: var(--bg-panel);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 16px;
    }
    .panel-section {
      margin-bottom: 20px;
    }
    .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .prop-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 12px;
    }
    .prop-row label { color: #c9d1d9; }
    .prop-input {
      width: 120px;
      background: #111215;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      outline: none;
    }
    .prop-slider {
      flex: 1;
      margin: 0 10px;
      accent-color: var(--accent);
    }
    .slider-val {
      font-family: monospace;
      font-size: 11px;
      color: var(--text-muted);
      width: 36px;
      text-align: right;
    }

    .curve-canvas-wrap {
      width: 100%;
      height: 95px;
      background: #111215;
      border: 1px solid var(--border);
      border-radius: 6px;
      position: relative;
      margin-top: 6px;
    }
    #curveCanvas {
      width: 100%;
      height: 100%;
    }

    .code-export-box {
      background: #111215;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 11px;
      color: #a5d6ff;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .export-btns {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Fredoka:wght@600;700&family=Outfit:wght@500;700;800&family=Poppins:wght@700;800&display=swap" rel="stylesheet">
</head>
<body>

  <!-- HEADER -->
  <header>
    <div class="app-brand">
      <span>🎬 Keynote Preset Inspector</span>
      <span class="app-badge">Motion Studio</span>
    </div>
    <div class="header-actions">
      <button class="btn" id="openSandboxBtn" onclick="window.location.href='content-sandbox.html'">
        <span>🚀 Open Storyboard Sandbox</span>
      </button>
      <button class="btn btn-primary" id="copyJsonBtn" onclick="copyBeatJson()">
        <span>📋 Copy Beat JSON</span>
      </button>
    </div>
  </header>

  <!-- WORKSPACE -->
  <div class="workspace">

    <!-- LEFT SIDEBAR: PRESET BROWSER -->
    <div class="sidebar-left">
      <div class="search-box">
        <input type="text" id="presetSearch" class="search-input" placeholder="Search presets & recipes..." oninput="filterPresets()">
      </div>
      <div class="preset-tree" id="presetTree">
        <!-- Dynamically rendered -->
      </div>
    </div>

    <!-- CENTER STAGE -->
    <div class="stage-area">
      <div class="stage-topbar">
        <div class="theme-picker">
          <span>Theme Canvas:</span>
          <select id="stageThemeSelect" class="theme-select" onchange="changeStageTheme(this.value)">
            <option value="headroomPaper">Headroom Paper (Warm Kraft)</option>
            <option value="headroomInk">Headroom Ink (Watercolour)</option>
            <option value="cinematicDarkRoom">Cinematic Documentary</option>
            <option value="editorialInfographic">Editorial Infographic</option>
          </select>
        </div>
        <div style="font-size: 12px; color: #8b949e;">
          Canvas: <span id="currentPresetName" style="color: #fff; font-weight: 600;">headroomCeilingRise</span>
        </div>
      </div>

      <div class="canvas-viewport">
        <div class="stage-frame theme-headroomPaper" id="stageFrame">
          <div class="stage-content" id="stageContent">
            <!-- Optional Procedural Prop Overlays -->
            <div id="supplementOverlay"></div>

            <div class="animated-title" id="animatedTitle">
              <!-- Rendered words with transforms -->
            </div>
            <div class="animated-subtitle" id="animatedSubtitle">
              Testing organic spring physics & motion paths
            </div>
          </div>
        </div>
      </div>

      <!-- TIMELINE & SCRUBBER -->
      <div class="timeline-bar">
        <div class="scrubber-track" id="scrubberTrack" onmousedown="startScrub(event)">
          <div class="scrubber-rail">
            <div class="scrubber-progress" id="scrubberProgress"></div>
          </div>
          <div class="scrubber-thumb" id="scrubberThumb"></div>
        </div>

        <div class="timeline-controls">
          <div class="playback-group">
            <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
            <button class="btn" style="padding: 4px 8px;" onclick="replayAnimation()">↺ Replay</button>
            <div class="time-display" id="timeDisplay">0.00s / 1.00s</div>
          </div>

          <div class="speed-pills">
            <button class="speed-btn" onclick="setSpeed(0.25, this)">0.25x</button>
            <button class="speed-btn" onclick="setSpeed(0.5, this)">0.5x</button>
            <button class="speed-btn active" onclick="setSpeed(1, this)">1x</button>
            <button class="speed-btn" onclick="setSpeed(2, this)">2x</button>
          </div>
        </div>
      </div>
    </div>

    <!-- RIGHT SIDEBAR: INSPECTOR -->
    <div class="sidebar-right">
      <div class="panel-section">
        <div class="section-label">Test Phrase</div>
        <input type="text" id="testTextInput" class="prop-input" style="width: 100%;" value="Room to Breathe" oninput="updateStageText()">
      </div>

      <div class="panel-section">
        <div class="section-label">Animation Parameters</div>
        <div class="prop-row">
          <label>Duration</label>
          <input type="range" id="durationSlider" class="prop-slider" min="0.3" max="3.0" step="0.05" value="0.9" oninput="updateParam('duration', this.value)">
          <span class="slider-val" id="durationVal">0.90s</span>
        </div>
        <div class="prop-row">
          <label>Stagger Delay</label>
          <input type="range" id="staggerSlider" class="prop-slider" min="0.01" max="0.18" step="0.01" value="0.08" oninput="updateParam('stagger', this.value)">
          <span class="slider-val" id="staggerVal">0.08s</span>
        </div>
        <div class="prop-row">
          <label>Spring Bounce</label>
          <input type="range" id="springSlider" class="prop-slider" min="0" max="25" step="1" value="14" oninput="updateParam('spring', this.value)">
          <span class="slider-val" id="springVal">14</span>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-label">Realtime Easing Curve</div>
        <div class="curve-canvas-wrap">
          <canvas id="curveCanvas"></canvas>
        </div>
      </div>

      <div class="panel-section">
        <div class="section-label">Generated Snippet</div>
        <div class="code-export-box" id="codeSnippetBox">
// Selecting preset...
        </div>
        <div class="export-btns">
          <button class="btn btn-primary" style="flex:1;" onclick="copyInlineTag()">📋 Copy Tag</button>
          <button class="btn" style="flex:1;" onclick="copyBeatJson()">📋 Copy JSON</button>
        </div>
      </div>
    </div>

  </div>

  <script>
    // PRESET CATALOG REGISTRY
    const PRESETS = {
      "Headroom Entries": [
        { id: "headroomCeilingRise", type: "entry", intent: "Expands ceiling upward with harmonic bounce", tag: "[breathe]", headroom: true },
        { id: "whirlwindAssemble", type: "entry", intent: "Logarithmic vortex convergence from flight coordinates", tag: "[declutter]", headroom: true },
        { id: "paperFwipIn", type: "entry", intent: "Crisp 3D card pop-up hinged at baseline", tag: "[pageTurn]", headroom: true },
        { id: "splitPinHinged", type: "entry", intent: "Puppet card drop swinging on top brass pin", tag: "[pin]", headroom: true },
        { id: "pushpinStamp", type: "entry", intent: "Card slams from camera and is anchored by pushpin", tag: "[pushpin]", headroom: true },
        { id: "filingDrawerSlide", type: "entry", intent: "Filing drawer slides forward out of cabinet", tag: "[organize]", headroom: true },
        { id: "inkRibbonTaper", type: "entry", intent: "Hand-inked pen stroke reveal with tracking expansion", tag: "[hand]", headroom: true },
        { id: "compressSquash", type: "entry", intent: "Phrases squash under compression and rebound", tag: "[compress]", headroom: true },
        { id: "tokenMeterFill", type: "entry", intent: "Segmented metric indicators scale with shadow lift", tag: "[meter]", headroom: true },
        { id: "steamingNote", type: "entry", intent: "Floats into scene like warm steam drifting", tag: "[float]", headroom: true }
      ],
      "Headroom Emphasis": [
        { id: "headroomBonk", type: "emphasis", intent: "Vertical squish and spring rebound impact", tag: "[bonk]", headroom: true },
        { id: "paperCreaseFlutter", type: "emphasis", intent: "Card lifts with shadow expansion and flutters along crease", tag: "[emphasis:crease]", headroom: true },
        { id: "pinTwitch", type: "emphasis", intent: "Quick rotational twitch around split-pin hinge", tag: "[emphasis:twitch]", headroom: true },
        { id: "tokenBurnPulse", type: "emphasis", intent: "Radiant expansion pulse like burning token fuel", tag: "[emphasis:burn]", headroom: true },
        { id: "cabinetNudge", type: "emphasis", intent: "Drawer forward-and-back inspection nudge in depth", tag: "[emphasis:nudge]", headroom: true },
        { id: "whirlSpurt", type: "emphasis", intent: "Short rotary acceleration pulse", tag: "[emphasis:spurt]", headroom: true },
        { id: "shelfRumble", type: "emphasis", intent: "Rapid micro-vibration desk rumble", tag: "[emphasis:rumble]", headroom: true }
      ],
      "Advance Pro Entries": [
        { id: "cinematicRise", type: "entry", intent: "Dignified ascent with letter tracking contraction", tag: "[title]", pro: true },
        { id: "dimensionalTurn", type: "entry", intent: "3D dimensional rotation with realistic paper shading", tag: "[reveal]", pro: true },
        { id: "depthFocus", type: "entry", intent: "Travels from deep blur into razor sharpness", tag: "[focus]", pro: true },
        { id: "baselineLock", type: "entry", intent: "Slides upward snapping cleanly to baseline", tag: "[definition]", pro: true },
        { id: "heroDropSettle", type: "entry", intent: "Controlled monument impact with heavy settle", tag: "[monument]", pro: true },
        { id: "editorialTrackIn", type: "entry", intent: "High-speed headline slide settling on a dime", tag: "[editorial]", pro: true },
        { id: "magneticSnap", type: "entry", intent: "High-tension spring snap with no wobble", tag: "[snap]", pro: true }
      ],
      "Tactile Props & Fasteners": [
        { id: "brassPin", type: "supplement", intent: "Fastens phrase with metallic split pin", tag: "[brassPin]", headroom: true },
        { id: "pushPin", type: "supplement", intent: "3D plastic pushpin anchoring card", tag: "[pushPin]", headroom: true },
        { id: "washiTape", type: "supplement", intent: "Translucent patterned tape over card", tag: "[washiTape]", headroom: true },
        { id: "folderTab", type: "supplement", intent: "Filing tab divider with category label", tag: "[folderTab]", headroom: true },
        { id: "tokenMeter", type: "supplement", intent: "Vertical fuel gauge measuring consumption", tag: "[tokenMeter:85]", headroom: true },
        { id: "watercolorWash", type: "supplement", intent: "Organic pigment wash backing", tag: "[watercolorWash]", headroom: true }
      ],
      "Complete Storyboard Recipes": [
        { id: "breathe", type: "recipe", intent: "Ceiling lifts with harmonic spring, giving breathing room", recipe: "breathe", headroom: true },
        { id: "compress", type: "recipe", intent: "Squashes noisy fragments into tight justified lockup", recipe: "compress", headroom: true },
        { id: "organize", type: "recipe", intent: "Structured filing drawer slide with index tabs", recipe: "organize", headroom: true },
        { id: "declutter", type: "recipe", intent: "Scattered papers spiral into order with whirlwind", recipe: "declutter", headroom: true },
        { id: "tokenEconomy", type: "recipe", intent: "Token budget indicator & quantitative gauge", recipe: "tokenEconomy", headroom: true },
        { id: "pinnedNote", type: "recipe", intent: "Card fastened with brass pin and washi tape", recipe: "pinnedNote", headroom: true },
        { id: "impact", type: "recipe", intent: "Bonk impact with camera rumble shockwave", recipe: "impact", headroom: true },
        { id: "title", type: "recipe", intent: "Hero topic ascent with deep tracking contraction", recipe: "title", pro: true },
        { id: "definition", type: "recipe", intent: "Precise terminology on clean paper strips", recipe: "definition", pro: true }
      ]
    };

    // ACTIVE STATE
    let activePreset = PRESETS["Headroom Entries"][0];
    let duration = 0.9;
    let stagger = 0.08;
    let springTension = 14;
    let currentTime = 0;
    let isPlaying = true;
    let playbackSpeed = 1.0;
    let animFrameId = null;
    let lastTimestamp = 0;

    // INITIALIZATION
    window.addEventListener('DOMContentLoaded', () => {
      renderPresetTree();
      selectPreset(activePreset.id);
      drawCurveCanvas();
      startAnimationLoop();
    });

    function renderPresetTree() {
      const tree = document.getElementById('presetTree');
      tree.innerHTML = '';
      for (const [category, items] of Object.entries(PRESETS)) {
        const group = document.createElement('div');
        group.className = 'category-group';
        group.innerHTML = `<div class="category-title"><span>${category}</span><span>${items.length}</span></div>`;

        items.forEach(item => {
          const row = document.createElement('div');
          row.className = `preset-item ${item.id === activePreset.id ? 'active' : ''}`;
          row.id = `item-${item.id}`;
          row.onclick = () => selectPreset(item.id);
          
          let badge = '';
          if (item.headroom) badge = '<span class="tag-badge tag-headroom">Headroom</span>';
          else if (item.pro) badge = '<span class="tag-badge tag-pro">Pro</span>';

          row.innerHTML = `<span>${item.id}</span>${badge}`;
          group.appendChild(row);
        });
        tree.appendChild(group);
      }
    }

    function selectPreset(presetId) {
      let found = null;
      for (const items of Object.values(PRESETS)) {
        found = items.find(i => i.id === presetId);
        if (found) break;
      }
      if (!found) return;

      activePreset = found;
      document.querySelectorAll('.preset-item').forEach(el => el.classList.remove('active'));
      const activeEl = document.getElementById(`item-${presetId}`);
      if (activeEl) activeEl.classList.add('active');

      document.getElementById('currentPresetName').textContent = activePreset.id;
      updateCodeSnippet();
      replayAnimation();
    }

    function filterPresets() {
      const q = document.getElementById('presetSearch').value.toLowerCase();
      document.querySelectorAll('.preset-item').forEach(el => {
        const text = el.textContent.toLowerCase();
        el.style.display = text.includes(q) ? 'flex' : 'none';
      });
    }

    function changeStageTheme(theme) {
      const frame = document.getElementById('stageFrame');
      frame.className = `stage-frame theme-${theme}`;
      updateCodeSnippet();
    }

    function updateStageText() {
      replayAnimation();
    }

    function updateParam(name, val) {
      if (name === 'duration') {
        duration = parseFloat(val);
        document.getElementById('durationVal').textContent = duration.toFixed(2) + 's';
      } else if (name === 'stagger') {
        stagger = parseFloat(val);
        document.getElementById('staggerVal').textContent = stagger.toFixed(2) + 's';
      } else if (name === 'spring') {
        springTension = parseFloat(val);
        document.getElementById('springVal').textContent = springTension;
      }
      drawCurveCanvas();
      updateCodeSnippet();
      replayAnimation();
    }

    // ANIMATION & EASING ENGINE
    function getEaseProgress(t) {
      // Natural spring / damped oscillator
      if (activePreset.id === 'headroomCeilingRise' || activePreset.id === 'breathe') {
        // Damped harmonic lift
        return 1 - Math.exp(-t * 6) * Math.cos(t * springTension * 0.8);
      } else if (activePreset.id === 'headroomBonk' || activePreset.id === 'impact') {
        // Squish impact rebound
        if (t < 0.2) return t / 0.2;
        return 1 + Math.exp(-(t - 0.2) * 8) * Math.sin((t - 0.2) * springTension) * 0.3;
      } else if (activePreset.id === 'whirlwindAssemble' || activePreset.id === 'declutter') {
        // Logarithmic spiral in
        return Math.pow(t, 2.2);
      } else if (activePreset.id === 'cinematicRise' || activePreset.id === 'title') {
        // Premium cubic decelerate
        return 1 - Math.pow(1 - t, 4);
      }
      // Default smooth anticipation
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function applyTransforms(progress) {
      const title = document.getElementById('animatedTitle');
      const text = document.getElementById('testTextInput').value || "Room to Breathe";
      const words = text.split(" ");
      const overlay = document.getElementById('supplementOverlay');

      // Update supplements
      overlay.innerHTML = '';
      if (activePreset.id === 'brassPin' || activePreset.id === 'pinnedNote') {
        overlay.innerHTML += `<div class="prop-brassPin" style="transform: scale(${Math.min(1, progress * 1.5)});"></div>`;
      }
      if (activePreset.id === 'pushPin') {
        overlay.innerHTML += `<div class="prop-pushPin" style="transform: translateX(-50%) scale(${Math.min(1, progress * 1.4)});"></div>`;
      }
      if (activePreset.id === 'washiTape' || activePreset.id === 'pinnedNote') {
        overlay.innerHTML += `<div class="prop-washiTape" style="opacity: ${Math.min(1, progress * 2)};"></div>`;
      }
      if (activePreset.id === 'folderTab' || activePreset.id === 'organize') {
        overlay.innerHTML += `<div class="prop-folderTab">INDEX 01</div>`;
      }
      if (activePreset.id === 'tokenMeter' || activePreset.id === 'tokenEconomy') {
        overlay.innerHTML += `<div class="prop-tokenMeter"><div class="token-meter-fill" style="width: ${Math.min(84, progress * 84)}%;"></div></div>`;
      }
      if (activePreset.id === 'watercolorWash') {
        overlay.innerHTML += `<div class="prop-watercolorWash" style="opacity: ${progress};"></div>`;
      }

      // Render words with stagger
      title.innerHTML = '';
      words.forEach((word, idx) => {
        const span = document.createElement('span');
        span.className = 'word-unit';
        span.textContent = word;

        const wordProgress = Math.max(0, Math.min(1, (progress - idx * (stagger / duration)) / (1 - (words.length * stagger / duration))));
        const p = getEaseProgress(wordProgress);

        let transform = '';
        let opacity = Math.min(1, wordProgress * 2.5);

        // Motion recipes & presets
        if (activePreset.id === 'headroomCeilingRise' || activePreset.id === 'breathe') {
          const y = (1 - p) * 90;
          const scaleY = 0.7 + p * 0.3;
          transform = `translateY(${y}px) scaleY(${scaleY})`;
        } else if (activePreset.id === 'whirlwindAssemble' || activePreset.id === 'declutter') {
          const rotZ = (1 - p) * 220;
          const scale = 0.2 + p * 0.8;
          transform = `rotate(${rotZ}deg) scale(${scale})`;
        } else if (activePreset.id === 'headroomBonk' || activePreset.id === 'impact') {
          const scaleY = p;
          const y = Math.sin(wordProgress * Math.PI) * 12;
          transform = `scaleY(${scaleY}) translateY(${y}px)`;
        } else if (activePreset.id === 'splitPinHinged' || activePreset.id === 'pinnedNote') {
          const rot = (1 - p) * -35 * Math.cos(wordProgress * springTension);
          transform = `rotate(${rot}deg) translateY(${(1-p) * -50}px)`;
        } else if (activePreset.id === 'cinematicRise' || activePreset.id === 'title') {
          const y = (1 - p) * 50;
          const letterSpacing = (1 - p) * 8;
          transform = `translateY(${y}px)`;
          span.style.letterSpacing = `${letterSpacing}px`;
        } else if (activePreset.id === 'filingDrawerSlide' || activePreset.id === 'organize') {
          const scale = 0.6 + p * 0.4;
          const y = (1 - p) * 45;
          transform = `translateY(${y}px) scale(${scale})`;
        } else {
          // Standard pop
          const y = (1 - p) * 40;
          transform = `translateY(${y}px)`;
        }

        span.style.transform = transform;
        span.style.opacity = opacity;
        title.appendChild(span);
      });
    }

    // TIMELINE LOOP
    function startAnimationLoop() {
      lastTimestamp = performance.now();
      function step(now) {
        const delta = (now - lastTimestamp) / 1000;
        lastTimestamp = now;

        if (isPlaying) {
          currentTime += delta * playbackSpeed;
          if (currentTime >= duration) {
            currentTime = 0; // loop
          }
          updatePlaybackUI();
        }

        const progress = Math.max(0, Math.min(1, currentTime / duration));
        applyTransforms(progress);

        animFrameId = requestAnimationFrame(step);
      }
      animFrameId = requestAnimationFrame(step);
    }

    function updatePlaybackUI() {
      const pct = (currentTime / duration) * 100;
      document.getElementById('scrubberProgress').style.width = pct + '%';
      document.getElementById('scrubberThumb').style.left = pct + '%';
      document.getElementById('timeDisplay').textContent = `${currentTime.toFixed(2)}s / ${duration.toFixed(2)}s`;
    }

    function togglePlay() {
      isPlaying = !isPlaying;
      document.getElementById('playBtn').textContent = isPlaying ? '⏸' : '▶';
    }

    function replayAnimation() {
      currentTime = 0;
      isPlaying = true;
      document.getElementById('playBtn').textContent = '⏸';
      updatePlaybackUI();
    }

    function setSpeed(speed, btn) {
      playbackSpeed = speed;
      document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function startScrub(e) {
      const track = document.getElementById('scrubberTrack');
      function onMove(evt) {
        const rect = track.getBoundingClientRect();
        const ratio = Math.max(0, Math.min(1, (evt.clientX - rect.left) / rect.width));
        currentTime = ratio * duration;
        updatePlaybackUI();
        applyTransforms(ratio);
      }
      function onUp() {
        window.removeEventListener('mousemove', onMove);
        window.removeEventListener('mouseup', onUp);
      }
      window.addEventListener('mousemove', onMove);
      window.addEventListener('mouseup', onUp);
      onMove(e);
    }

    // DRAW CURVE VISUALIZER
    function drawCurveCanvas() {
      const canvas = document.getElementById('curveCanvas');
      const ctx = canvas.getContext('2d');
      const w = canvas.width = canvas.parentElement.clientWidth;
      const h = canvas.height = canvas.parentElement.clientHeight;

      ctx.clearRect(0, 0, w, h);

      // Gridlines
      ctx.strokeStyle = '#22252c';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(20, h - 15); ctx.lineTo(w - 20, h - 15);
      ctx.moveTo(20, 15); ctx.lineTo(w - 20, 15);
      ctx.stroke();

      // Plot ease
      ctx.strokeStyle = '#0a84ff';
      ctx.lineWidth = 2.5;
      ctx.beginPath();

      const startX = 20;
      const endX = w - 20;
      const startY = h - 15;
      const endY = 15;

      for (let x = startX; x <= endX; x++) {
        const t = (x - startX) / (endX - startX);
        const p = getEaseProgress(t);
        const y = startY - p * (startY - endY);
        if (x === startX) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    // CODE SNIPPET EXPORT
    function updateCodeSnippet() {
      const box = document.getElementById('codeSnippetBox');
      const theme = document.getElementById('stageThemeSelect').value;
      const text = document.getElementById('testTextInput').value || "Room to Breathe";

      let snippet = "";
      if (activePreset.recipe) {
        snippet = JSON.stringify({
          "text": `[accent]${text}[/accent]`,
          "recipe": activePreset.recipe,
          "duration": parseFloat(duration.toFixed(2))
        }, null, 2);
      } else if (activePreset.type === 'supplement') {
        snippet = `"${activePreset.tag}${text}[/${activePreset.id}]"`;
      } else {
        snippet = JSON.stringify({
          "text": `${activePreset.tag}${text}`,
          "entry": activePreset.id,
          "duration": parseFloat(duration.toFixed(2))
        }, null, 2);
      }
      box.textContent = snippet;
    }

    function copyInlineTag() {
      const tag = activePreset.tag || `[${activePreset.id}]`;
      navigator.clipboard.writeText(tag).then(() => {
        alert(`Copied inline tag to clipboard: ${tag}`);
      });
    }

    function copyBeatJson() {
      const box = document.getElementById('codeSnippetBox').textContent;
      navigator.clipboard.writeText(box).then(() => {
        alert("Copied Beat JSON to clipboard! Ready to paste into content.json");
      });
    }
  </script>
</body>
