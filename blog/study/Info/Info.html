                    { name: "Composition", keywords: ["well-organized", "balanced", "symmetrical", "asymmetrical", "white space", "breathing room", "visual hierarchy", "focal point", "eye-flow", "alignment", "centered", "left-aligned", "justified"] },
                    { name: "Mood", keywords: ["bright", "dark", "warm", "cold", "energetic", "calm", "dynamic", "static", "luxurious", "corporate", "techy", "organic", "natural", "urban", "whimsical", "dramatic"] },
                    { name: "AI-Specific", keywords: ["generate infographic", "create infographic", "design infographic", "infographic template", "editable infographic", "customizable", "AI-generated", "auto-layout", "smart design", "data-to-visual", "text-to-infographic"] }
                ]
            }
        ];

        const FORMULA_TEMPLATE = `Create a [TYPE] infographic about [TOPIC] in a [STYLE] style using a [COLOR PALETTE] color scheme. Include [DATA ELEMENTS] with [CHART TYPES].
Use [ICON STYLE] icons, [FONT STYLE] typography, and a [LAYOUT] layout.
The tone should be [TONE]. Optimize for [PLATFORM] at [SIZE/RESOLUTION].
Add [SPECIAL ELEMENTS] and ensure [BRANDING] elements are included.
Output as [FILE FORMAT].`;

        // --- MAIN APP COMPONENT ---
        function App() {
            // State
            const [promptText, setPromptText] = useState("");
            const [history, setHistory] = useState([]);
            const [customKeywords, setCustomKeywords] = useState({});
            const [searchQuery, setSearchQuery] = useState("");
            const [expandedCategories, setExpandedCategories] = useState(["layout"]); 
            const [darkMode, setDarkMode] = useState(true);
            const [notification, setNotification] = useState("");
            const [activeTab, setActiveTab] = useState("slicer"); // 'slicer' | 'masterStyle' | 'generated' | 'editor' | 'history'

            // NEW: Content Slicer state
            const [sourceText, setSourceText] = useState("");
            const [slices, setSlices] = useState([]);
            const [commonTexts, setCommonTexts] = useState([]);

            // NEW: Master Style state
            const [masterStyles, setMasterStyles] = useState([]);
            const [activeMasterStyleId, setActiveMasterStyleId] = useState(null);
            const [activeTarget, setActiveTarget] = useState('editor'); // 'editor' | 'masterStyle'

            // NEW: Prompt Generation state
            const [generatedPrompts, setGeneratedPrompts] = useState([]);
            const [wrapMode, setWrapMode] = useState('backticks');

            // NEW: Projects state
            const [projects, setProjects] = useState([]);

            const textareaRef = useRef(null);
            const masterStyleRef = useRef(null);

            // Load data from LocalStorage on mount
            useEffect(() => {
                const savedHistory = localStorage.getItem("infographic_prompt_history");
                const savedCustoms = localStorage.getItem("infographic_custom_keywords");
                const savedTheme = localStorage.getItem("infographic_theme");

                if (savedHistory) setHistory(JSON.parse(savedHistory));
                if (savedCustoms) setCustomKeywords(JSON.parse(savedCustoms));
                
                if (savedTheme === 'light') {
                    setDarkMode(false);
                    document.documentElement.classList.remove('dark');
                } else {
                    document.documentElement.classList.add('dark');
                }

                // Load new state
                try {
                    const st = localStorage.getItem("infographic_source_text"); if (st) setSourceText(st);
                    const sl = localStorage.getItem("infographic_slices"); if (sl) setSlices(JSON.parse(sl));
                    const ct = localStorage.getItem("infographic_common_texts"); if (ct) setCommonTexts(JSON.parse(ct));
                    const ms = localStorage.getItem("infographic_master_styles"); if (ms) setMasterStyles(JSON.parse(ms));
                    const asi = localStorage.getItem("infographic_active_style_id"); if (asi) setActiveMasterStyleId(asi);
                    const at = localStorage.getItem("infographic_active_target"); if (at) setActiveTarget(at);
                    const pj = localStorage.getItem("infographic_projects"); if (pj) setProjects(JSON.parse(pj));
                    const wm = localStorage.getItem("infographic_wrap_mode"); if (wm) setWrapMode(wm);
                } catch(e) { console.warn('Error loading saved state:', e); }
            }, []);

            // Save state to LocalStorage
            useEffect(() => {
                localStorage.setItem("infographic_prompt_history", JSON.stringify(history));
            }, [history]);

            useEffect(() => {
                localStorage.setItem("infographic_custom_keywords", JSON.stringify(customKeywords));
            }, [customKeywords]);

            // Persist new state
            useEffect(() => { localStorage.setItem("infographic_source_text", sourceText); }, [sourceText]);
            useEffect(() => { localStorage.setItem("infographic_slices", JSON.stringify(slices)); }, [slices]);
            useEffect(() => { localStorage.setItem("infographic_common_texts", JSON.stringify(commonTexts)); }, [commonTexts]);
            useEffect(() => { localStorage.setItem("infographic_master_styles", JSON.stringify(masterStyles)); }, [masterStyles]);
            useEffect(() => { localStorage.setItem("infographic_active_style_id", activeMasterStyleId || ''); }, [activeMasterStyleId]);
            useEffect(() => { localStorage.setItem("infographic_active_target", activeTarget); }, [activeTarget]);
            useEffect(() => { localStorage.setItem("infographic_projects", JSON.stringify(projects)); }, [projects]);
            useEffect(() => { localStorage.setItem("infographic_wrap_mode", wrapMode); }, [wrapMode]);

            const toggleDarkMode = () => {
                const newMode = !darkMode;
                setDarkMode(newMode);
                if (newMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem("infographic_theme", 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem("infographic_theme", 'light');
                }
            };

            const showNotification = (msg) => {
                setNotification(msg);
                setTimeout(() => setNotification(""), 3000);
            };

            // Merge Default and Custom Keywords
            const data = useMemo(() => {
                return INITIAL_CATEGORIES.map(cat => {
                    const mappedSubs = cat.subcategories.map(sub => {
                        const custom = customKeywords[`${cat.id}_${sub.name}`] || [];
                        return { ...sub, keywords: [...sub.keywords, ...custom] };
                    });
                    return { ...cat, subcategories: mappedSubs };
                });
            }, [customKeywords]);

            // Filter data based on search and auto-expand matches
            const filteredData = useMemo(() => {
                if (!searchQuery.trim()) return data;
                
                const query = searchQuery.toLowerCase();
                const newExpanded = new Set(expandedCategories);
                
                const filtered = data.map(cat => {
                    let catHasMatch = false;
                    const subcategories = cat.subcategories.map(sub => {
                        const keywords = sub.keywords.filter(k => k.toLowerCase().includes(query));
                        if (keywords.length > 0) catHasMatch = true;
                        return { ...sub, keywords };
                    }).filter(sub => sub.keywords.length > 0);
                    
                    if (catHasMatch || cat.title.toLowerCase().includes(query)) {
                        newExpanded.add(cat.id);
                        return { ...cat, subcategories };
                    }
                    return null;
                }).filter(Boolean);

                setExpandedCategories(Array.from(newExpanded));
                return filtered;
            }, [data, searchQuery]);

            const toggleCategory = (id) => {
                setExpandedCategories(prev => 
                    prev.includes(id) ? prev.filter(c => c !== id) : [...prev, id]
                );
            };

            const toggleAllCategories = (expand) => {
                if (expand) {
                    setExpandedCategories(data.map(c => c.id));
                } else {
                    setExpandedCategories([]);
                }
            };

            // Generic cursor-position insertion for any textarea ref
            const insertTextIntoRef = (ref, text, setter) => {
                const textarea = ref.current;
                if (!textarea) return;

                const startPos = textarea.selectionStart;
                const endPos = textarea.selectionEnd;
                const currentVal = textarea.value;

                let prefix = "";
                if (startPos > 0 && currentVal.charAt(startPos - 1) !== " " && currentVal.charAt(startPos - 1) !== "\n") {
                    prefix = " ";
                }

                const newVal = currentVal.substring(0, startPos) + prefix + text + ", " + currentVal.substring(endPos);
                setter(newVal);

                setTimeout(() => {
                    textarea.focus();
                    textarea.selectionStart = startPos + prefix.length + text.length + 2;
                    textarea.selectionEnd = startPos + prefix.length + text.length + 2;
                }, 0);
            };

            const insertTextAtCursor = (text) => {
                insertTextIntoRef(textareaRef, text, setPromptText);
            };

            const handleKeywordClick = (keyword) => {
                if (activeTarget === 'masterStyle' && masterStyleRef.current) {
                    // Need to get the current content from the master style ref
                    const textarea = masterStyleRef.current;
                    const startPos = textarea.selectionStart;
                    const endPos = textarea.selectionEnd;
                    const currentVal = textarea.value;
                    let prefix = "";
                    if (startPos > 0 && currentVal.charAt(startPos - 1) !== " " && currentVal.charAt(startPos - 1) !== "\n") prefix = " ";
                    const newVal = currentVal.substring(0, startPos) + prefix + keyword + ", " + currentVal.substring(endPos);
                    // Dispatch input event so React picks up the change
                    const nativeInputValueSetter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
                    nativeInputValueSetter.call(textarea, newVal);
                    textarea.dispatchEvent(new Event('input', { bubbles: true }));
                    setTimeout(() => {
                        textarea.focus();
                        textarea.selectionStart = startPos + prefix.length + keyword.length + 2;
                        textarea.selectionEnd = startPos + prefix.length + keyword.length + 2;
                    }, 0);
                    showNotification('Added to Master Style: ' + keyword);

                    insertTextAtCursor(keyword);

                    setCustomKeywords(prev => ({
                        ...prev,
                        [key]: [...(prev[key] || []), word.trim()]

                    customKeywords,

                                        </div>
                                        <div className="text-sm font-mono text-gray-700 dark:text-gray-300 line-clamp-3 mb-2">{item.text}</div>
                                        <button onClick={() => { navigator.clipboard.writeText(item.text); showNotification("Copied!"); }} className="text-sm text-primary-600 font-medium flex items-center space-x-1"><Icons.Copy /> <span>Copy</span></button>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
