<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Zoom Architect - Infinite Zoom Creator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gray: {
                            750: '#2d3748',
                            850: '#1a202c',
                            950: '#0d1117',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { 
            background-color: #0d1117; 
            color: #e2e8f0; 
            overflow: hidden; 
            font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
        }
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #1a202c; }
        ::-webkit-scrollbar-thumb { background: #4a5568; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #718096; }
        
        .canvas-container {
            background-image: url('https://www.transparenttextures.com/patterns/cubes.png');
            background-repeat: repeat;
        }

        /* Lucide Icon Fallback/Base */
        .icon { width: 1em; height: 1em; }
    </style>

    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.263.1",
            "jszip": "https://esm.sh/jszip@3.10.1",
            "file-saver": "https://esm.sh/file-saver@2.0.5"
        }
    }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useRef, useEffect, useCallback, useMemo } from 'react';
        import ReactDOM from 'react-dom';
        import { 
            Download, Upload, Image as ImageIcon, Plus, Minus, 
            FileJson, Trash2, Copy, Lock, Unlock, Eye, EyeOff, 
            ArrowUp, ArrowDown, Maximize, Minimize, Move, Square
        } from 'lucide-react';
        import JSZip from 'jszip';
        import saveAs from 'file-saver';

        // --- Types & Constants ---
        const FitMode = {
            CONTAIN: 'CONTAIN',
            COVER: 'COVER',
            STRETCH: 'STRETCH',
            CENTER: 'CENTER'
        };

        const DEFAULT_CONFIG = {
            width: 1024,
            height: 768,
            backgroundColor: '#000000',
            totalLevels: 88
        };

        const HANDLE_SIZE = 8;
        const HANDLE_OFFSET = 15;

        // --- Utils ---
        const getScaleForLevel = (targetLevel, objectAnchorLevel) => Math.pow(2, targetLevel - objectAnchorLevel);

        // --- Components: Canvas Engine ---
        const CanvasEngine = ({ objects, config, currentLevel, selectedId, onSelect, onUpdateObject, imageCache }) => {
            const canvasRef = useRef(null);
            const [dragState, setDragState] = useState({
                isDragging: false,
                isResizing: false,
                isRotating: false,
                startX: 0,
                startY: 0,
                initialObjectState: null,
                handle: null
            });

            const render = useCallback(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                if (!ctx) return;

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (config.backgroundColor !== 'transparent') {
                    ctx.fillStyle = config.backgroundColor;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;

                objects.forEach(obj => {
                    if (obj.hidden) return;
                    const img = imageCache.current.get(obj.src);
                    if (!img) return;

                    const scale = getScaleForLevel(currentLevel, obj.anchorLevel);
                    if (obj.width * scale < 1) return; 

                    ctx.save();
                    const screenX = centerX + (obj.x * scale);
                    const screenY = centerY + (obj.y * scale);
                    
                    ctx.translate(screenX, screenY);
                    ctx.rotate(obj.rotation);
                    ctx.scale(obj.flipX ? -1 : 1, obj.flipY ? -1 : 1);
                    ctx.globalAlpha = obj.opacity;

                    const drawW = obj.width * scale;
                    const drawH = obj.height * scale;
                    ctx.drawImage(img, -drawW / 2, -drawH / 2, drawW, drawH);
                    ctx.restore();

                    if (obj.id === selectedId) {
                        ctx.save();
                        ctx.translate(screenX, screenY);
                        ctx.rotate(obj.rotation);
                        const w = obj.width * scale;
                        const h = obj.height * scale;

                        ctx.strokeStyle = '#00a8ff';
                        ctx.lineWidth = 2;
                        ctx.strokeRect(-w/2, -h/2, w, h);

                        ctx.fillStyle = '#fff';
                        ctx.strokeStyle = '#00a8ff';
                        ctx.lineWidth = 1;

                        const handles = [
                            { x: -w/2, y: -h/2, name: 'tl' },
                            { x: w/2, y: -h/2, name: 'tr' },
                            { x: w/2, y: h/2, name: 'br' },
                            { x: -w/2, y: h/2, name: 'bl' },
                        ];

                        handles.forEach(hPos => {
                            ctx.beginPath();
                            ctx.rect(hPos.x - HANDLE_SIZE/2, hPos.y - HANDLE_SIZE/2, HANDLE_SIZE, HANDLE_SIZE);
                            ctx.fill();
                            ctx.stroke();
                        });

                        ctx.beginPath();
                        ctx.moveTo(0, -h/2);
                        ctx.lineTo(0, -h/2 - HANDLE_OFFSET);
                        ctx.stroke();

                        ctx.beginPath();
                        ctx.arc(0, -h/2 - HANDLE_OFFSET, HANDLE_SIZE/2, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.stroke();
                        ctx.restore();
                    }
                });
            }, [objects, config, currentLevel, selectedId, imageCache]);

            useEffect(() => {
                let loadingCount = 0;
                objects.forEach(obj => {
                    if (!imageCache.current.has(obj.src)) {
                        loadingCount++;
                        const img = new Image();
                        img.src = obj.src;
                        img.onload = () => {
                            imageCache.current.set(obj.src, img);
                            render();
                        };
                    }
                });
                if (loadingCount === 0) render();
            }, [objects, render, imageCache]);

            const getMousePos = (e) => {
                const rect = canvasRef.current.getBoundingClientRect();
                return { x: e.clientX - rect.left, y: e.clientY - rect.top };
            };

            const isOverHandle = (mx, my, obj) => {
                const scale = getScaleForLevel(currentLevel, obj.anchorLevel);
                const screenX = (config.width / 2) + (obj.x * scale);
                const screenY = (config.height / 2) + (obj.y * scale);
                const cos = Math.cos(-obj.rotation), sin = Math.sin(-obj.rotation);
                const lx = (mx - screenX) * cos - (my - screenY) * sin;
                const ly = (mx - screenX) * sin + (my - screenY) * cos;
                const w = obj.width * scale, h = obj.height * scale;
                const hs = HANDLE_SIZE + 4;

                if (Math.abs(lx - (-w/2)) < hs && Math.abs(ly - (-h/2)) < hs) return 'tl';
                if (Math.abs(lx - (w/2)) < hs && Math.abs(ly - (-h/2)) < hs) return 'tr';
                if (Math.abs(lx - (w/2)) < hs && Math.abs(ly - (h/2)) < hs) return 'br';
                if (Math.abs(lx - (-w/2)) < hs && Math.abs(ly - (h/2)) < hs) return 'bl';
                if (Math.abs(lx) < hs && Math.abs(ly - (-h/2 - HANDLE_OFFSET)) < hs) return 'rot';
                return null;
            };

            const handleMouseDown = (e) => {
                const { x: mx, y: my } = getMousePos(e);
                if (selectedId) {
                    const sel = objects.find(o => o.id === selectedId);
                    if (sel && !sel.locked) {
                        const h = isOverHandle(mx, my, sel);
                        if (h) {
                            setDragState({ isDragging: false, isResizing: h !== 'rot', isRotating: h === 'rot', startX: mx, startY: my, handle: h, initialObjectState: { ...sel } });
                            return;
                        }
                    }
                }

                let hitId = null;
                for (let i = objects.length - 1; i >= 0; i--) {
                    const obj = objects[i];
                    if (obj.hidden || obj.locked) continue;
                    const scale = getScaleForLevel(currentLevel, obj.anchorLevel);
                    const sx = (config.width / 2) + (obj.x * scale), sy = (config.height / 2) + (obj.y * scale);
                    const cos = Math.cos(-obj.rotation), sin = Math.sin(-obj.rotation);
                    const lx = (mx - sx) * cos - (my - sy) * sin, ly = (mx - sx) * sin + (my - sy) * cos;
                    if (lx >= -obj.width*scale/2 && lx <= obj.width*scale/2 && ly >= -obj.height*scale/2 && ly <= obj.height*scale/2) {
                        hitId = obj.id; break;
                    }
                }
                onSelect(hitId);
                if (hitId) {
                    const obj = objects.find(o => o.id === hitId);
                    setDragState({ isDragging: true, isResizing: false, isRotating: false, startX: mx, startY: my, handle: null, initialObjectState: { ...obj } });
                }
            };

            const handleMouseMove = (e) => {
                const { x: mx, y: my } = getMousePos(e);
                if (selectedId) {
                    const sel = objects.find(o => o.id === selectedId);
                    if (sel) {
                        const h = isOverHandle(mx, my, sel);
                        if (canvasRef.current) {
                            canvasRef.current.style.cursor = h === 'rot' ? 'alias' : (h ? 'nwse-resize' : 'default');
                        }
                    }
                }
                if (!dragState.initialObjectState || !selectedId) return;

                const dx = mx - dragState.startX, dy = my - dragState.startY;
                const currentScaleFactor = Math.pow(2, currentLevel);

                if (dragState.isDragging) {
                    onUpdateObject(selectedId, {
                        x: dragState.initialObjectState.x + (dx / currentScaleFactor),
                        y: dragState.initialObjectState.y + (dy / currentScaleFactor)
                    });
                } else if (dragState.isRotating) {
                    const sel = objects.find(o => o.id === selectedId);
                    const scale = getScaleForLevel(currentLevel, sel.anchorLevel);
                    const sx = (config.width / 2) + (sel.x * scale), sy = (config.height / 2) + (sel.y * scale);
                    onUpdateObject(selectedId, { rotation: Math.atan2(my - sy, mx - sx) + Math.PI / 2 });
                } else if (dragState.isResizing) {
                    let sf = 1;
                    if (dragState.handle.includes('t')) sf = 1 - (dy * 0.005);
                    if (dragState.handle.includes('b')) sf = 1 + (dy * 0.005);
                    onUpdateObject(selectedId, {
                        width: Math.max(10, dragState.initialObjectState.width * sf),
                        height: Math.max(10, dragState.initialObjectState.height * sf)
                    });
                }
            };

            const handleMouseUp = () => setDragState(p => ({ ...p, isDragging: false, isResizing: false, isRotating: false, initialObjectState: null }));

            return (
                <canvas
                    ref={canvasRef}
                    width={config.width}
                    height={config.height}
                    className="border border-gray-700 shadow-2xl bg-black"
                    onMouseDown={handleMouseDown}
                    onMouseMove={handleMouseMove}
                    onMouseUp={handleMouseUp}
                    onMouseLeave={handleMouseUp}
                />
            );
        };

        // --- Components: Property Panel ---
        const PropertyPanel = ({ selectedObject, config, onUpdateObject, onDelete, onDuplicate, onLayerOrder, onFit, onUpdateConfig, currentLevel }) => {
            if (!selectedObject) {
                return (
                    <div className="w-80 bg-gray-900 border-l border-gray-700 p-4 flex flex-col gap-6 overflow-y-auto">
                        <div>
                            <h2 className="text-gray-400 font-bold uppercase text-xs mb-3 tracking-wider">Canvas Settings</h2>
                            <div className="space-y-4">
                                <div className="flex flex-col gap-1">
                                    <label className="text-xs text-gray-400">Total Zoom Levels</label>
                                    <input type="number" value={config.totalLevels} onChange={(e) => onUpdateConfig({ totalLevels: Math.max(1, parseInt(e.target.value)) })} className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm text-white" />
                                </div>
                                <div className="flex flex-col gap-1">
                                    <label className="text-xs text-gray-400">Background Color</label>
                                    <div className="flex gap-2">
                                        <input type="color" value={config.backgroundColor === 'transparent' ? '#000000' : config.backgroundColor} onChange={(e) => onUpdateConfig({ backgroundColor: e.target.value })} className="h-8 w-8 cursor-pointer bg-transparent border-0" />
                                        <button onClick={() => onUpdateConfig({ backgroundColor: 'transparent' })} className={`text-xs px-2 py-1 rounded border ${config.backgroundColor === 'transparent' ? 'bg-blue-600 border-blue-600' : 'border-gray-600'}`}>Transparent</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div className="flex-1 flex items-center justify-center text-gray-600 text-sm text-center px-4 italic">Select an object to edit properties</div>
                    </div>
                );
            }

            return (
                <div className="w-80 bg-gray-900 border-l border-gray-700 p-4 flex flex-col gap-6 overflow-y-auto h-full">
                    <div className="flex justify-between items-center pb-4 border-b border-gray-800">
                        <h2 className="font-semibold text-white truncate max-w-[150px]">{selectedObject.name}</h2>
                        <div className="flex gap-1">
                            <button onClick={() => onUpdateObject(selectedObject.id, { locked: !selectedObject.locked })} className="p-1.5 hover:bg-gray-800 rounded text-gray-400">{selectedObject.locked ? <Lock size={14}/> : <Unlock size={14}/>}</button>
                            <button onClick={() => onUpdateObject(selectedObject.id, { hidden: !selectedObject.hidden })} className="p-1.5 hover:bg-gray-800 rounded text-gray-400">{selectedObject.hidden ? <EyeOff size={14}/> : <Eye size={14}/>}</button>
                            <button onClick={() => onDuplicate(selectedObject.id)} className="p-1.5 hover:bg-gray-800 rounded text-gray-400"><Copy size={14}/></button>
                            <button onClick={() => onDelete(selectedObject.id)} className="p-1.5 hover:bg-red-900/50 text-red-400 rounded"><Trash2 size={14}/></button>
                        </div>
                    </div>

                    <div>
                        <h3 className="text-gray-500 font-bold text-[10px] uppercase mb-2">Layer Order</h3>
                        <div className="grid grid-cols-4 gap-1">
                            {['front', 'forward', 'backward', 'back'].map(dir => (
                                <button key={dir} onClick={() => onLayerOrder(selectedObject.id, dir)} className="bg-gray-800 hover:bg-gray-700 p-1 rounded text-[10px] text-gray-300 capitalize">{dir === 'forward' ? 'Up' : dir === 'backward' ? 'Down' : dir}</button>
                            ))}
                        </div>
                    </div>

                    <div>
                        <h3 className="text-gray-500 font-bold text-[10px] uppercase mb-2">Anchor Level</h3>
                        <div className="flex items-center gap-2">
                            <input type="number" value={selectedObject.anchorLevel} onChange={(e) => onUpdateObject(selectedObject.id, { anchorLevel: parseFloat(e.target.value) })} className="w-full bg-gray-800 border border-gray-700 rounded px-2 py-1 text-sm" />
                            <button onClick={() => onUpdateObject(selectedObject.id, { anchorLevel: currentLevel })} className="px-2 py-1 bg-blue-700 text-white text-xs rounded hover:bg-blue-600 whitespace-nowrap">Set Current</button>
                        </div>
                    </div>

                    <div className="space-y-3">
                        <h3 className="text-gray-500 font-bold text-[10px] uppercase">Transform</h3>
                        <div className="grid grid-cols-2 gap-2">
                            {['x', 'y', 'width', 'height'].map(k => (
                                <div key={k} className="flex flex-col">
                                    <label className="text-[10px] text-gray-500 uppercase">{k}</label>
                                    <input type="number" value={Math.round(selectedObject[k])} onChange={(e) => onUpdateObject(selectedObject.id, { [k]: parseFloat(e.target.value) })} className="bg-gray-800 border border-gray-700 rounded px-2 py-1 text-xs" />
                                </div>
                            ))}
                        </div>
                        <div className="flex items-center gap-2">
                            <label className="text-xs text-gray-400 w-16">Rotation</label>
                            <input type="range" min="0" max="360" value={(selectedObject.rotation * 180 / Math.PI) % 360} onChange={(e) => onUpdateObject(selectedObject.id, { rotation: e.target.value * Math.PI / 180 })} className="flex-1 accent-blue-500" />
                            <span className="text-xs w-8 text-right">{Math.round((selectedObject.rotation * 180 / Math.PI) % 360)}°</span>
                        </div>
                    </div>

                    <div className="space-y-3">
                        <h3 className="text-gray-500 font-bold text-[10px] uppercase">Appearance</h3>
                        <div className="flex items-center gap-2">
                            <label className="text-xs text-gray-400 w-16">Opacity</label>
                            <input type="range" min="0" max="1" step="0.01" value={selectedObject.opacity} onChange={(e) => onUpdateObject(selectedObject.id, { opacity: parseFloat(e.target.value) })} className="flex-1 accent-blue-500" />
                            <span className="text-xs w-8 text-right">{Math.round(selectedObject.opacity * 100)}%</span>
                        </div>
                        <div className="flex gap-2">
                            <button onClick={() => onUpdateObject(selectedObject.id, { flipX: !selectedObject.flipX })} className={`flex-1 py-1 text-xs rounded border ${selectedObject.flipX ? 'bg-blue-900 border-blue-700' : 'bg-gray-800 border-gray-700'}`}>Flip H</button>
                            <button onClick={() => onUpdateObject(selectedObject.id, { flipY: !selectedObject.flipY })} className={`flex-1 py-1 text-xs rounded border ${selectedObject.flipY ? 'bg-blue-900 border-blue-700' : 'bg-gray-800 border-gray-700'}`}>Flip V</button>
                        </div>
                    </div>

                    <div>
                        <h3 className="text-gray-500 font-bold text-[10px] uppercase mb-2">Auto Fit</h3>
                        <div className="grid grid-cols-2 gap-2">
                            {Object.values(FitMode).map(m => (
                                <button key={m} onClick={() => onFit(selectedObject.id, m)} className="bg-gray-800 hover:bg-gray-700 text-[10px] py-1.5 rounded uppercase tracking-tighter">{m}</button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        // --- Main App Component ---
        function App() {
            const [config, setConfig] = useState(DEFAULT_CONFIG);
            const [objects, setObjects] = useState([]);
            const [selectedId, setSelectedId] = useState(null);
            const [currentLevel, setCurrentLevel] = useState(0);
            const [isExporting, setIsExporting] = useState(false);
            const imageCache = useRef(new Map());

            const handleAddImage = (e) => {
                const files = e.target.files;
                if (!files) return;
                Array.from(files).forEach(file => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const src = event.target.result;
                        const img = new Image();
                        img.src = src;
                        img.onload = () => {
                            imageCache.current.set(src, img);
                            const newObj = {
                                id: crypto.randomUUID(),
                                type: file.type.includes('svg') ? 'svg' : 'image',
                                name: file.name,
                                src,
                                x: 0, y: 0,
                                width: 400, height: 400 * (img.height / img.width),
                                rotation: 0, opacity: 1, flipX: false, flipY: false,
                                anchorLevel: currentLevel, locked: false, hidden: false
                            };
                            setObjects(prev => [...prev, newObj]);
                            setSelectedId(newObj.id);
                        };
                    };
                    reader.readAsDataURL(file);
                });
                e.target.value = '';
            };

            const updateObject = (id, updates) => setObjects(prev => prev.map(o => o.id === id ? { ...o, ...updates } : o));
            const deleteObject = (id) => { setObjects(prev => prev.filter(o => o.id !== id)); if (selectedId === id) setSelectedId(null); };
            const duplicateObject = (id) => {
                const obj = objects.find(o => o.id === id);
                if (!obj) return;
                const newObj = { ...obj, id: crypto.randomUUID(), name: `${obj.name} (Copy)`, x: obj.x + (20 / Math.pow(2, currentLevel)), y: obj.y + (20 / Math.pow(2, currentLevel)) };
                setObjects(prev => [...prev, newObj]);
                setSelectedId(newObj.id);
            };

            const changeLayerOrder = (id, direction) => {
                setObjects(prev => {
                    const idx = prev.findIndex(o => o.id === id);
                    if (idx === -1) return prev;
                    const list = [...prev], [item] = list.splice(idx, 1);
                    if (direction === 'back') list.unshift(item);
                    else if (direction === 'front') list.push(item);
                    else if (direction === 'backward') list.splice(Math.max(0, idx - 1), 0, item);
                    else if (direction === 'forward') list.splice(Math.min(list.length, idx + 1), 0, item);
                    return list;
                });
            };

            const fitObjectToCanvas = (id, mode) => {
                const obj = objects.find(o => o.id === id);
                const img = imageCache.current.get(obj?.src);
                if (!obj || !img) return;
                const scale = getScaleForLevel(currentLevel, obj.anchorLevel);
                let newW = obj.width, newH = obj.height;
                const canvasRatio = config.width / config.height, imgRatio = img.width / img.height;
                if (mode === FitMode.COVER) {
                    if (canvasRatio > imgRatio) { newW = config.width / scale; newH = (config.width / imgRatio) / scale; }
                    else { newH = config.height / scale; newW = (config.height * imgRatio) / scale; }
                } else if (mode === FitMode.CONTAIN) {
                    if (canvasRatio > imgRatio) { newH = config.height / scale; newW = (config.height * imgRatio) / scale; }
                    else { newW = config.width / scale; newH = (config.width / imgRatio) / scale; }
                } else if (mode === FitMode.STRETCH) {
                    newW = config.width / scale; newH = config.height / scale;
                }
                updateObject(id, { x: 0, y: 0, width: newW, height: newH });
            };

            const exportJSON = () => {
                const blob = new Blob([JSON.stringify({ version: 2, config, objects }, null, 2)], { type: 'application/json' });
                saveAs(blob, 'infinite_zoom_project.json');
            };

            const importJSON = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (evt) => {
                    try {
                        const data = JSON.parse(evt.target.result);
                        if (data.config) setConfig(data.config);
                        if (data.objects) setObjects(data.objects);
                        setCurrentLevel(0);
                    } catch (err) { alert('Invalid Project File'); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const exportImages = async () => {
                setIsExporting(true);
                const zip = new JSZip();
                const canvas = document.createElement('canvas');
                canvas.width = config.width; canvas.height = config.height;
                const ctx = canvas.getContext('2d');
                try {
                    for (let i = 0; i < config.totalLevels; i++) {
                        ctx.clearRect(0, 0, config.width, config.height);
                        if (config.backgroundColor !== 'transparent') { ctx.fillStyle = config.backgroundColor; ctx.fillRect(0, 0, config.width, config.height); }
                        const cx = config.width / 2, cy = config.height / 2;
                        objects.forEach(obj => {
                            if (obj.hidden) return;
                            const img = imageCache.current.get(obj.src);
                            const scale = Math.pow(2, i - obj.anchorLevel);
                            if (obj.width * scale < 0.5) return;
                            ctx.save();
                            ctx.translate(cx + (obj.x * scale), cy + (obj.y * scale));
                            ctx.rotate(obj.rotation);
                            ctx.scale(obj.flipX ? -1 : 1, obj.flipY ? -1 : 1);
                            ctx.globalAlpha = obj.opacity;
                            ctx.drawImage(img, -obj.width*scale/2, -obj.height*scale/2, obj.width*scale, obj.height*scale);
                            ctx.restore();
                        });
                        const blob = await new Promise(res => canvas.toBlob(res, config.backgroundColor === 'transparent' ? 'image/png' : 'image/jpeg', 0.9));
                        zip.file(`z_${i}.${config.backgroundColor === 'transparent' ? 'png' : 'jpg'}`, blob);
                        await new Promise(r => setTimeout(r, 0));
                    }
                    const content = await zip.generateAsync({ type: 'blob' });
                    saveAs(content, 'zoom_sequence.zip');
                } catch (e) { alert('Export failed'); }
                finally { setIsExporting(false); }
            };

            return (
                <div className="flex flex-col h-screen overflow-hidden text-sm bg-gray-950">
                    <div className="h-14 bg-gray-900 border-b border-gray-700 flex items-center px-4 justify-between shrink-0 z-20">
                        <div className="flex items-center gap-4">
                            <h1 className="text-xl font-bold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent mr-4">Zoom Architect</h1>
                            <div className="flex gap-2">
                                <label className="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded cursor-pointer border border-gray-700 transition">
                                    <Upload size={16} className="text-blue-400" />
                                    <span>Import Project</span>
                                    <input type="file" accept=".json" onChange={importJSON} className="hidden" />
                                </label>
                                <button onClick={exportJSON} className="flex items-center gap-2 bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded border border-gray-700 transition">
                                    <FileJson size={16} className="text-yellow-400" />
                                    <span>Save JSON</span>
                                </button>
                            </div>
                        </div>
                        <div className="flex items-center gap-4">
                            <label className="flex items-center gap-2 bg-blue-600 hover:bg-blue-500 px-4 py-1.5 rounded cursor-pointer font-semibold shadow-lg shadow-blue-900/20 transition">
                                <ImageIcon size={18} />
                                <span>Add Image</span>
                                <input type="file" accept="image/*,.svg" multiple onChange={handleAddImage} className="hidden" />
                            </label>
                            <button onClick={exportImages} disabled={isExporting} className={`flex items-center gap-2 px-4 py-1.5 rounded font-semibold border border-transparent transition ${isExporting ? 'bg-gray-700 cursor-not-allowed' : 'bg-green-600 hover:bg-green-500 shadow-lg shadow-green-900/20'}`}>
                                {isExporting ? "Rendering..." : <><Download size={18}/><span>Export ZIP</span></>}
                            </button>
                        </div>
                    </div>

                    <div className="flex flex-1 overflow-hidden relative">
                        <div className="flex-1 bg-gray-950 flex items-center justify-center overflow-hidden canvas-container relative">
                            <CanvasEngine objects={objects} config={config} currentLevel={currentLevel} selectedId={selectedId} onSelect={setSelectedId} onUpdateObject={updateObject} imageCache={imageCache} />
                            <div className="absolute top-4 left-4 bg-gray-900/80 backdrop-blur border border-gray-700 p-3 rounded-lg text-xs pointer-events-none shadow-xl">
                                <div className="text-blue-400 font-bold mb-1">Canvas Status</div>
                                <div className="opacity-70">Zoom: {Math.pow(2, currentLevel).toFixed(2)}x</div>
                                <div className="opacity-70">Objects: {objects.length}</div>
                            </div>

                            <div className="absolute bottom-6 left-1/2 -translate-x-1/2 bg-gray-900/95 backdrop-blur-md border border-gray-700 rounded-2xl px-8 py-3 flex items-center gap-8 shadow-2xl">
                                <button onClick={() => setCurrentLevel(l => l - 1)} className="hover:text-blue-400 transition transform hover:scale-110"><Minus size={24} /></button>
                                <div className="flex flex-col items-center w-40">
                                    <span className="text-[10px] text-gray-400 uppercase font-black tracking-widest mb-1">Level Navigation</span>
                                    <div className="flex items-center gap-2">
                                        <input type="number" value={currentLevel} onChange={(e) => setCurrentLevel(parseInt(e.target.value) || 0)} className="bg-gray-800 text-center font-mono text-2xl w-20 py-1 rounded-lg border border-gray-700 focus:border-blue-500 outline-none shadow-inner" />
                                        <span className="text-gray-600 text-lg font-bold">/ {config.totalLevels - 1}</span>
                                    </div>
                                </div>
                                <button onClick={() => setCurrentLevel(l => l + 1)} className="hover:text-blue-400 transition transform hover:scale-110"><Plus size={24} /></button>
                            </div>
                        </div>

                        <PropertyPanel selectedObject={objects.find(o => o.id === selectedId)} config={config} onUpdateObject={updateObject} onDelete={deleteObject} onDuplicate={duplicateObject} onLayerOrder={changeLayerOrder} onFit={fitObjectToCanvas} onUpdateConfig={u => setConfig(p => ({ ...p, ...u }))} currentLevel={currentLevel} />
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
