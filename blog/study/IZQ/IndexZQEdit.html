<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App V4 Edit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; overflow: hidden; }
        canvas { cursor: crosshair; image-rendering: -webkit-optimize-contrast; image-rendering: crisp-edges; }
        .no-select { user-select: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 10px; }
        
        input[type="range"] { accent-color: #3b82f6; }
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }

        .tool-btn { @apply p-2 hover:bg-slate-800 rounded text-slate-300 transition-colors disabled:opacity-30; }
        .action-btn { @apply flex items-center justify-center gap-2 px-3 py-1.5 rounded text-[10px] font-bold transition-all border border-slate-700 hover:border-blue-500; }
        .fit-mode-btn { @apply flex-1 p-2 bg-slate-800 hover:bg-blue-600 rounded text-[9px] uppercase font-bold text-center transition-all; }
        
        .transparent-bg-pattern {
            background-image: linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                              linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                              linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body class="flex flex-col h-screen no-select">

    <!-- Header / Toolbar -->
    <header class="bg-slate-900 border-b border-slate-700 p-3 flex items-center justify-between z-50">
        <div class="flex items-center gap-4">
            <h1 class="text-xl font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">ZoomStudio Pro <span class="text-[10px] opacity-50">V4</span></h1>
            
            <div class="h-6 w-px bg-slate-700"></div>
            
            <!-- Zoom Navigation -->
            <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
                <button onclick="changeLevel(-1)" class="tool-btn" title="Zoom Out">
                    <i data-lucide="zoom-out" class="w-4 h-4"></i>
                </button>
                <div class="flex items-center gap-1 px-2">
                    <span class="text-[9px] text-slate-500 font-bold">LEVEL</span>
                    <input type="number" id="level-input" value="0" min="0" 
                           onchange="setLevel(parseInt(this.value))"
                           class="w-12 bg-transparent text-center font-mono text-emerald-400 outline-none focus:text-white">
                </div>
                <button onclick="changeLevel(1)" class="tool-btn" title="Zoom In">
                    <i data-lucide="zoom-in" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Total Levels Control -->
            <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-lg border border-slate-800">
                <span class="text-[9px] text-slate-500 font-bold px-2">TOTAL LEVELS</span>
                <input type="number" id="total-levels-input" value="88" min="1" 
                       onchange="updateTotalLevels(parseInt(this.value))"
                       class="w-12 bg-transparent text-center font-mono text-slate-300 outline-none focus:text-white">
            </div>

            <div class="h-6 w-px bg-slate-700"></div>

            <!-- Background Control -->
            <div class="flex items-center gap-2">
                <span class="text-[9px] text-slate-500 font-bold">BG</span>
                <input type="color" id="bg-color-picker" value="#020617" 
                       oninput="updateBg('color', this.value)"
                       class="w-6 h-6 rounded border-none bg-transparent cursor-pointer">
                <button id="bg-trans-btn" onclick="updateBg('transparent')" 
                        class="px-2 py-1 rounded text-[9px] font-bold border border-slate-700 hover:bg-slate-800">
                    TRANSPARENT
                </button>
            </div>
        </div>

        <div class="flex items-center gap-3">
            <label class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded text-sm font-semibold cursor-pointer flex items-center gap-2 transition shadow-lg shadow-blue-900/20">
                <i data-lucide="image-plus" class="w-4 h-4"></i> Add Object
                <input type="file" id="file-input" class="hidden" accept="image/*,.svg" multiple>
            </label>
            <div class="h-6 w-px bg-slate-700 mx-1"></div>
            <button onclick="exportProject()" class="tool-btn" title="Export Project">
                <i data-lucide="download-cloud" class="w-5 h-5"></i>
            </button>
            <button onclick="importProject()" class="tool-btn" title="Import Project">
                <i data-lucide="upload-cloud" class="w-5 h-5"></i>
            </button>
            <button onclick="triggerBatchExport()" class="bg-emerald-600 hover:bg-emerald-500 px-4 py-2 rounded text-sm font-semibold flex items-center gap-2 transition shadow-lg shadow-emerald-900/20">
                <i data-lucide="file-archive" class="w-4 h-4"></i> Export All
            </button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <!-- Sidebar -->
        <aside class="w-80 bg-slate-900 border-r border-slate-700 flex flex-col overflow-hidden">
            <!-- Properties Section -->
            <div class="p-4 border-b border-slate-800 custom-scrollbar overflow-y-auto max-h-[60%]">
                <h2 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4 flex items-center gap-2">
                    <i data-lucide="settings-2" class="w-3 h-3"></i> Object Properties
                </h2>
                <div id="prop-panel" class="space-y-4">
                    <p class="text-sm text-slate-500 italic text-center py-8">Select an object to edit</p>
                </div>
            </div>
            
            <!-- Layers Section -->
            <div class="p-4 flex-1 flex flex-col overflow-hidden">
                <h2 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4 flex items-center gap-2">
                    <i data-lucide="layers" class="w-3 h-3"></i> Layer Stack
                </h2>
                <div id="layer-list" class="space-y-1 flex-1 custom-scrollbar overflow-y-auto">
                    <!-- Layer items -->
                </div>
            </div>
        </aside>

        <!-- Canvas -->
        <main class="flex-1 bg-slate-800 relative flex items-center justify-center overflow-hidden transparent-bg-pattern">
            <div class="relative shadow-2xl border border-slate-950" id="canvas-container">
                <canvas id="main-canvas" width="1024" height="768"></canvas>
            </div>
            
            <!-- Center Crosshair Overlay -->
            <div class="absolute pointer-events-none w-8 h-8 opacity-20">
                <div class="absolute top-1/2 left-0 w-full h-px bg-white"></div>
                <div class="absolute top-0 left-1/2 w-px h-full bg-white"></div>
            </div>
        </main>
    </div>

    <!-- Timeline Footer -->
    <footer class="bg-slate-900 border-t border-slate-700 p-3 h-16 flex items-center gap-6 px-6">
        <div class="flex-1 flex items-center gap-4">
            <span class="text-[10px] font-mono text-slate-500">START</span>
            <input type="range" id="level-slider" min="0" max="87" value="0" class="flex-1 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer">
            <span id="slider-max-label" class="text-[10px] font-mono text-slate-500">Z87</span>
        </div>
        <div id="export-status" class="hidden items-center gap-3">
            <div class="w-48 h-1.5 bg-slate-800 rounded-full overflow-hidden">
                <div id="export-bar" class="h-full bg-emerald-500 transition-all duration-100" style="width: 0%"></div>
            </div>
            <span id="export-text" class="text-[10px] text-slate-400 font-mono whitespace-nowrap">Processing...</span>
        </div>
    </footer>

    <script>
        // --- CONFIG ---
        const WIDTH = 1024;
        const HEIGHT = 768;
        const CX = WIDTH / 2;
        const CY = HEIGHT / 2;

        // --- STATE ---
        let totalLevels = 88;
        let currentLevel = 0;
        let objects = [];
        let selectedId = null;
        let isDragging = false;
        let dragMode = null; 
        let startX, startY;
        let initialObjState = null;
        let bgMode = 'color'; // 'color' or 'transparent'
        let bgColor = '#020617';

        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const levelInput = document.getElementById('level-input');
        const levelSlider = document.getElementById('level-slider');
        const totalLevelsInput = document.getElementById('total-levels-input');
        const sliderMaxLabel = document.getElementById('slider-max-label');
        const propPanel = document.getElementById('prop-panel');
        const layerList = document.getElementById('layer-list');

        // --- INITIALIZATION ---
        window.onload = () => {
            lucide.createIcons();
            setupEventListeners();
            render();
        };

        function setupEventListeners() {
            document.getElementById('file-input').addEventListener('change', handleFileUpload);
            levelSlider.addEventListener('input', (e) => setLevel(parseInt(e.target.value)));
            
            canvas.addEventListener('mousedown', onMouseDown);
            window.addEventListener('mousemove', onMouseMove);
            window.addEventListener('mouseup', onMouseUp);
            window.addEventListener('keydown', (e) => {
                if (e.key === 'Delete' || e.key === 'Backspace') deleteSelected();
                if (e.key === 'd' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); duplicateSelected(); }
            });
        }

        // --- LEVEL CONTROLS ---
        function setLevel(val) {
            currentLevel = Math.max(0, Math.min(totalLevels - 1, val));
            levelInput.value = currentLevel;
            levelSlider.value = currentLevel;
            render();
            updatePropPanel();
        }

        function changeLevel(delta) { setLevel(currentLevel + delta); }

        function updateTotalLevels(val) {
            totalLevels = Math.max(1, val);
            totalLevelsInput.value = totalLevels;
            levelSlider.max = totalLevels - 1;
            sliderMaxLabel.innerText = 'Z' + (totalLevels - 1);
            if (currentLevel >= totalLevels) setLevel(totalLevels - 1);
        }

        // --- BG CONTROLS ---
        function updateBg(mode, color) {
            bgMode = mode;
            if (color) bgColor = color;
            const btn = document.getElementById('bg-trans-btn');
            if (mode === 'transparent') {
                btn.classList.add('bg-blue-600', 'text-white');
            } else {
                btn.classList.remove('bg-blue-600', 'text-white');
            }
            render();
        }

        // --- OBJECT ACTIONS ---
        async function handleFileUpload(e) {
            const files = Array.from(e.target.files);
            for (const file of files) {
                const base64 = await fileToBase64(file);
                const img = new Image();
                img.src = base64;
                await img.decode();
                
                const obj = {
                    id: crypto.randomUUID(),
                    name: file.name,
                    img: img,
                    src: base64,
                    x: 0, y: 0,
                    w: img.width / 2,
                    h: img.height / 2,
                    origW: img.width,
                    origH: img.height,
                    rotation: 0,
                    opacity: 1,
                    flipX: false, flipY: false,
                    anchorLevel: currentLevel,
                    visible: true,
                    locked: false
                };
                objects.push(obj);
            }
            if (objects.length > 0) selectedId = objects[objects.length - 1].id;
            updateLayerList();
            render();
            updatePropPanel();
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }

        function duplicateSelected() {
            const o = objects.find(obj => obj.id === selectedId);
            if (!o) return;
            const newObj = { ...o, id: crypto.randomUUID(), x: o.x + 10, y: o.y + 10, name: o.name + ' (Copy)', locked: false };
            objects.push(newObj);
            selectedId = newObj.id;
            updateLayerList(); render(); updatePropPanel();
        }

        function deleteSelected() {
            if (!selectedId) return;
            objects = objects.filter(o => o.id !== selectedId);
            selectedId = null;
            updateLayerList(); render(); updatePropPanel();
        }

        function reorder(dir) {
            const idx = objects.findIndex(o => o.id === selectedId);
            if (idx === -1) return;
            const o = objects.splice(idx, 1)[0];
            if (dir === 'front') objects.push(o);
            else if (dir === 'back') objects.unshift(o);
            else if (dir === 'fwd') objects.splice(Math.min(objects.length, idx + 1), 0, o);
            else if (dir === 'bwd') objects.splice(Math.max(0, idx - 1), 0, o);
            updateLayerList(); render();
        }

        // --- FIT MODES ---
        function applyFit(mode) {
            const o = objects.find(obj => obj.id === selectedId);
            if (!o) return;

            // Current visible world frame dimensions
            const worldScaleAtLevel = Math.pow(2, currentLevel);
            const viewW = WIDTH / worldScaleAtLevel;
            const viewH = HEIGHT / worldScaleAtLevel;

            // Target dimensions for the object in world space relative to ITS anchor
            const scaleToLevel = Math.pow(2, o.anchorLevel - currentLevel);
            const targetW = viewW * scaleToLevel;
            const targetH = viewH * scaleToLevel;

            o.x = 0; o.y = 0; o.rotation = 0;

            if (mode === 'stretch') {
                o.w = targetW; o.h = targetH;
            } else if (mode === 'fit' || mode === 'fill') {
                const ratioImg = o.origW / o.origH;
                const ratioView = WIDTH / HEIGHT;
                if ((mode === 'fit' && ratioImg > ratioView) || (mode === 'fill' && ratioImg < ratioView)) {
                    o.w = targetW; o.h = targetW / ratioImg;
                } else {
                    o.h = targetH; o.w = targetH * ratioImg;
                }
            } else if (mode === 'tile') { // Reset to original dimensions
                o.w = o.origW; o.h = o.origH;
            } else if (mode === 'center') {
                // Already did x=0, y=0
            }

            render(); updatePropPanel();
        }

        // --- MOUSE ENGINE ---
        function onMouseDown(e) {
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left, my = e.clientY - rect.top;

            if (selectedId) {
                const o = objects.find(obj => obj.id === selectedId);
                const h = getHandleAt(mx, my, o);
                if (h && !o.locked) {
                    dragMode = h; isDragging = true;
                    startX = mx; startY = my; initialObjState = { ...o };
                    return;
                }
            }

            let hit = null;
            for (let i = objects.length - 1; i >= 0; i--) {
                if (isMouseOverObject(mx, my, objects[i])) {
                    hit = objects[i]; break;
                }
            }

            if (hit) {
                selectedId = hit.id;
                dragMode = hit.locked ? null : 'move';
                isDragging = !hit.locked;
                startX = mx; startY = my; initialObjState = { ...hit };
            } else { selectedId = null; }

            updateLayerList(); updatePropPanel(); render();
        }

        function onMouseMove(e) {
            if (!isDragging || !selectedId) return;
            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left, my = e.clientY - rect.top;
            const o = objects.find(obj => obj.id === selectedId);
            const worldScale = Math.pow(2, currentLevel);
            const relativeScale = Math.pow(2, currentLevel - o.anchorLevel);

            if (dragMode === 'move') {
                o.x = initialObjState.x + (mx - startX) / worldScale;
                o.y = initialObjState.y + (my - startY) / worldScale;
            } else if (dragMode === 'scale') {
                const dx = (mx - startX) / relativeScale;
                o.w = Math.max(5, initialObjState.w + dx);
                o.h = initialObjState.h * (o.w / initialObjState.w); 
            } else if (dragMode === 'rotate') {
                const ox = CX + o.x * worldScale, oy = CY + o.y * worldScale;
                o.rotation = Math.atan2(my - oy, mx - ox);
            }
            render(); updatePropPanel();
        }

        function onMouseUp() { isDragging = false; dragMode = null; }

        function isMouseOverObject(mx, my, o) {
            const s = Math.pow(2, currentLevel - o.anchorLevel), ws = Math.pow(2, currentLevel);
            const w = o.w * s, h = o.h * s;
            const x = CX + o.x * ws - w/2, y = CY + o.y * ws - h/2;
            return mx >= x && mx <= x + w && my >= y && my <= y + h;
        }

        function getHandleAt(mx, my, o) {
            const s = Math.pow(2, currentLevel - o.anchorLevel), ws = Math.pow(2, currentLevel);
            const w = o.w * s, h = o.h * s;
            const x = CX + o.x * ws - w/2, y = CY + o.y * ws - h/2;
            if (dist(mx, my, x + w, y + h) < 15) return 'scale';
            if (dist(mx, my, x + w/2, y - 20) < 15) return 'rotate';
            return null;
        }

        function dist(x1, y1, x2, y2) { return Math.sqrt((x2-x1)**2 + (y2-y1)**2); }

        // --- RENDERER ---
        function render() {
            if (bgMode === 'transparent') ctx.clearRect(0, 0, WIDTH, HEIGHT);
            else { ctx.fillStyle = bgColor; ctx.fillRect(0, 0, WIDTH, HEIGHT); }

            objects.forEach(o => {
                if (!o.visible) return;
                const s = Math.pow(2, currentLevel - o.anchorLevel), ws = Math.pow(2, currentLevel);
                const w = o.w * s, h = o.h * s;
                const x = CX + o.x * ws, y = CY + o.y * ws;

                ctx.save();
                ctx.globalAlpha = o.opacity;
                ctx.translate(x, y);
                ctx.rotate(o.rotation);
                ctx.scale(o.flipX ? -1 : 1, o.flipY ? -1 : 1);
                ctx.drawImage(o.img, -w/2, -h/2, w, h);

                if (o.id === selectedId) {
                    ctx.scale(o.flipX ? -1 : 1, o.flipY ? -1 : 1); 
                    ctx.strokeStyle = '#3b82f6'; ctx.lineWidth = 2;
                    ctx.strokeRect(-w/2, -h/2, w, h);
                    if (!o.locked) {
                        ctx.fillStyle = '#3b82f6';
                        ctx.beginPath(); ctx.arc(w/2, h/2, 6, 0, Math.PI*2); ctx.fill();
                        ctx.beginPath(); ctx.moveTo(0, -h/2); ctx.lineTo(0, -h/2-20); ctx.stroke();
                        ctx.beginPath(); ctx.arc(0, -h/2-20, 6, 0, Math.PI*2); ctx.fill();
                    }
                }
                ctx.restore();
            });
        }

        // --- UI UPDATES ---
        function updateLayerList() {
            layerList.innerHTML = '';
            objects.slice().reverse().forEach(o => {
                const item = document.createElement('div');
                item.className = `flex items-center justify-between p-2 rounded cursor-pointer text-xs mb-1 group ${o.id === selectedId ? 'bg-blue-600/20 border border-blue-500/50 text-blue-100' : 'hover:bg-slate-800 text-slate-400'}`;
                item.onclick = () => { selectedId = o.id; render(); updatePropPanel(); updateLayerList(); };
                item.innerHTML = `
                    <div class="flex items-center gap-2 overflow-hidden">
                        <i data-lucide="${o.locked ? 'lock' : 'image'}" class="w-3 h-3 flex-shrink-0 opacity-50"></i>
                        <span class="truncate">${o.name}</span>
                    </div>
                    <div class="flex gap-1">
                        <button onclick="event.stopPropagation(); toggleLock('${o.id}')" class="p-1 hover:text-white ${o.locked ? 'text-blue-400' : 'opacity-0 group-hover:opacity-100'}">
                            <i data-lucide="${o.locked ? 'lock' : 'unlock'}" class="w-3 h-3"></i>
                        </button>
                    </div>
                `;
                layerList.appendChild(item);
            });
            lucide.createIcons();
        }

        function toggleLock(id) {
            const o = objects.find(obj => obj.id === id);
            o.locked = !o.locked;
            render(); updateLayerList(); updatePropPanel();
        }

        function updatePropPanel() {
            if (!selectedId) { propPanel.innerHTML = '<p class="text-sm text-slate-500 italic text-center py-8">Select an object to edit</p>'; return; }
            const o = objects.find(obj => obj.id === selectedId);
            propPanel.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <span class="text-[10px] text-slate-500 font-bold uppercase">Object Lock</span>
                        <button onclick="toggleLock('${o.id}')" class="px-3 py-1 rounded text-[9px] font-bold ${o.locked ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}">
                            ${o.locked ? 'LOCKED' : 'UNLOCKED'}
                        </button>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] text-slate-500 font-bold uppercase">Fit to Level</label>
                        <div class="flex gap-1">
                            <button onclick="applyFit('fit')" class="fit-mode-btn">Fit</button>
                            <button onclick="applyFit('fill')" class="fit-mode-btn">Fill</button>
                            <button onclick="applyFit('stretch')" class="fit-mode-btn">Stretch</button>
                            <button onclick="applyFit('tile')" class="fit-mode-btn">Orig</button>
                            <button onclick="applyFit('center')" class="fit-mode-btn">Center</button>
                        </div>
                    </div>

                    <div class="space-y-2">
                        <label class="text-[10px] text-slate-500 font-bold uppercase">Arrangement</label>
                        <div class="grid grid-cols-4 gap-1">
                            <button onclick="reorder('front')" class="tool-btn border border-slate-700" title="Front"><i data-lucide="chevrons-up" class="w-3 h-3 mx-auto"></i></button>
                            <button onclick="reorder('fwd')" class="tool-btn border border-slate-700" title="Forward"><i data-lucide="chevron-up" class="w-3 h-3 mx-auto"></i></button>
                            <button onclick="reorder('bwd')" class="tool-btn border border-slate-700" title="Backward"><i data-lucide="chevron-down" class="w-3 h-3 mx-auto"></i></button>
                            <button onclick="reorder('back')" class="tool-btn border border-slate-700" title="Back"><i data-lucide="chevrons-down" class="w-3 h-3 mx-auto"></i></button>
                        </div>
                    </div>

                    <div>
                        <label class="text-[10px] text-slate-500 block mb-1 font-bold uppercase">Opacity</label>
                        <input type="range" min="0" max="1" step="0.01" value="${o.opacity}" 
                            oninput="updateSelectedProp('opacity', parseFloat(this.value))" class="w-full">
                    </div>

                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="updateSelectedProp('flipX', !${o.flipX})" class="action-btn ${o.flipX ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}"><i data-lucide="flip-horizontal" class="w-3 h-3"></i> Flip H</button>
                        <button onclick="updateSelectedProp('flipY', !${o.flipY})" class="action-btn ${o.flipY ? 'bg-blue-600 text-white' : 'bg-slate-800 text-slate-400'}"><i data-lucide="flip-vertical" class="w-3 h-3"></i> Flip V</button>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div><label class="text-[9px] text-slate-500 uppercase font-bold">Anchor Lvl</label>
                        <input type="number" value="${o.anchorLevel}" onchange="updateSelectedProp('anchorLevel', parseInt(this.value))" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-xs"></div>
                        <div><label class="text-[9px] text-slate-500 uppercase font-bold">Rotation</label>
                        <input type="number" value="${Math.round(o.rotation * 180 / Math.PI)}" onchange="updateSelectedProp('rotation', parseInt(this.value) * Math.PI / 180)" class="bg-slate-950 border border-slate-700 rounded px-2 py-1 w-full text-xs"></div>
                    </div>

                    <div class="flex gap-2">
                        <button onclick="duplicateSelected()" class="flex-1 bg-slate-800 hover:bg-slate-700 text-white py-2 rounded text-xs flex items-center justify-center gap-2">Duplicate</button>
                        <button onclick="deleteSelected()" class="bg-red-900/20 hover:bg-red-900/40 text-red-400 p-2 rounded border border-red-900/30"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                </div>
            `;
            lucide.createIcons();
        }

        function updateSelectedProp(key, val) {
            const o = objects.find(obj => obj.id === selectedId);
            if (o) { o[key] = val; render(); if (['flipX', 'flipY', 'opacity', 'anchorLevel'].includes(key)) updatePropPanel(); }
        }

        // --- PROJECT IO ---
        function exportProject() {
            const data = { version: "4.0", totalLevels, bgMode, bgColor, objects: objects.map(o => ({ ...o, img: null })) };
            saveAs(new Blob([JSON.stringify(data)], {type: 'application/json'}), "zoom_v4_project.json");
        }

        async function importProject() {
            const input = document.createElement('input'); input.type = 'file'; input.accept = '.json';
            input.onchange = async (e) => {
                const data = JSON.parse(await e.target.files[0].text());
                if (data.totalLevels) updateTotalLevels(data.totalLevels);
                if (data.bgMode) updateBg(data.bgMode, data.bgColor);
                const newObjs = [];
                for (const o of data.objects) {
                    const img = new Image(); img.src = o.src; await img.decode();
                    newObjs.push({ ...o, img });
                }
                objects = newObjs; selectedId = null; setLevel(0); updateLayerList();
            };
            input.click();
        }

        async function triggerBatchExport() {
            const originalLevel = currentLevel, originalSelected = selectedId;
            selectedId = null;
            const zip = new JSZip();
            const exportStatus = document.getElementById('export-status'), exportBar = document.getElementById('export-bar'), exportText = document.getElementById('export-text');
            exportStatus.classList.replace('hidden', 'flex');

            const mime = bgMode === 'transparent' ? 'image/png' : 'image/jpeg';
            const ext = bgMode === 'transparent' ? 'png' : 'jpg';

            for (let i = 0; i < totalLevels; i++) {
                currentLevel = i; render();
                const blob = await new Promise(r => canvas.toBlob(r, mime, 0.95));
                zip.file(`z_${i}.${ext}`, blob);
                exportBar.style.width = `${((i+1)/totalLevels)*100}%`;
                exportText.innerText = `Rendering z_${i}.${ext}...`;
                if (i % 10 === 0) await new Promise(r => setTimeout(r, 10));
            }

            saveAs(await zip.generateAsync({type: 'blob'}), "zoom_v4_frames.zip");
            exportStatus.classList.replace('flex', 'hidden');
            currentLevel = originalLevel; selectedId = originalSelected; render();
        }
    </script>
</body>
</html>
