<!DOCTYPE html>
<html>

<head>
	<title>App</title>
	<meta charset="utf-8">
	<meta name="description" content="App ">
	<meta property="og:title" content="App" />
	<meta property="og:description" content="App">
	<meta property="og:type" content="website" />
	<meta property="og:url" content="default.html" />
	<meta property="og:image" content="images\z_0.jpg">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<link rel="stylesheet" type="text/css" media="all" href="zoom.css" />




	<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>

<body class="loading">
	<div id="nav">

		<div class="seekbar">
			<div class="seekbar-visible">
				<div class="marker filtered"></div>
			</div>
		</div>
		<canvas id="preview" class="filtered" width="0" height="0"></canvas>
	</div>
	<div id="loading">
		<div id='status' class="filtered">
			<div id='loadbar'></div>
		</div>
	</div>

	<!-- Modern Settings Panel (Hidden by default, visible on hover) -->
	<div id="modern-controls-trigger"></div>
	<div id="modern-controls-panel">
		<div class="glass-panel">
			<h3>Settings</h3>
			<div class="control-group">
				<label>Speed</label>
				<input type="range" id="modern-speed" min="-100" max="100" value="12">
			</div>
			<div class="control-group">
				<label>Effects</label>
				<div class="fx-toggles">
					<button id="mod-fx-none" class="active">None</button>
					<button id="mod-fx-trippy">Trippy</button>
					<button id="mod-fx-bw">B&W</button>
				</div>
			</div>
			<div class="status-info">
				<span id="image-count">88 Images</span>
			</div>
		</div>
	</div>

	<!-- Drop Zone Overlay -->
	<div id="drop-zone" class="hidden">
		<div class="drop-message">
			<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
				<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
				<polyline points="17 8 12 3 7 8"></polyline>
				<line x1="12" y1="3" x2="12" y2="15"></line>
			</svg>
			<p>Drop ZIP file here</p>
		</div>
	</div>





	<canvas id="zc" class="filtered" width="0" height="0"><span data-nosnippet>done</span></canvas>

	<!-- <script src="js/jquery-1.9.0.min.js"></script> -->
	<script src="jquery.min.js"></script>
	<script src="content.js" type="text/javascript"></script>


</body>

</html>
