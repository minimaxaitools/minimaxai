                                    )}
                                </div>
                            ) : (
                                <div className="flex-1 overflow-y-auto sb-thin p-2">
                                    {historyList.length === 0 ? (
                                        <div className="text-center text-gray-400 text-sm py-8">
                                            <Icon name="eye" size={32} className="mx-auto mb-2 opacity-40" />
                                            <p>No files viewed yet</p>
                                        </div>
                                    ) : (
                                        historyList.map(h => (
                                            <div key={h.path} className="history-item" onClick={() => {
                                                const node = libraryFiles.find(f => f.path === h.path);
                                                if (node) openFile(node);
                                            }}>
                                                <span className="dot viewed" />
                                                <div className="flex-1 min-w-0">
                                                    <div className="font-semibold text-gray-800 line-clamp-1">{h.name}</div>
                                                    <div className="text-xs text-gray-400 line-clamp-1">{h.path}</div>
                                                </div>
                                                <span className="text-xs text-gray-400 flex-shrink-0">{new Date(h.lastOpened).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</span>
                                            </div>
                                        ))
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Main area */}
                        <div className="flex-1 flex flex-col overflow-hidden">
                            {/* Tab bar */}
                            {openTabs.length > 0 && (
                                <div className="tab-bar">
                                    {openTabs.map(tab => (
                                        <div key={tab.path} className={`tab-item ${activeTab === tab.path ? 'active' : ''}`} onClick={() => { setActiveTab(tab.path); setViewHistory(prev => ({ ...prev, [tab.path]: { viewed: true, lastOpened: new Date().toISOString() } })); }}>
                                            <Icon name="file-text" size={13} />
                                            <span>{tab.name}</span>
                                            <span className="tab-close" onClick={(e) => closeTab(tab.path, e)}>×</span>
                                        </div>
                                    ))}
                                </div>
                            )}

                            <div className="flex-1 flex overflow-hidden">
                                {/* Editor Panel */}
                                {showEditor && activeTab && (
                                    <div className="w-[380px] flex-shrink-0 border-r border-gray-200 bg-white flex flex-col">
                                        <div className="p-3 border-b border-gray-100 flex items-center justify-between">
                                            <h3 className="text-sm font-bold text-gray-700 flex items-center gap-2"><Icon name="code" size={16} />Editor</h3>
                                            <button onClick={commitEditor} className="px-3 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-1">
                                                <Icon name="eye" size={14} />Preview
                                            </button>
                                        </div>
                                        <textarea value={editorText} onChange={e => setEditorText(e.target.value)} onBlur={commitEditor} className="flex-1 p-4 text-sm font-mono text-gray-800 leading-relaxed resize-none outline-none bg-gray-50" spellCheck={false} />
                                    </div>
                                )}

                                {/* Preview Panel */}
                                <div className="flex-1 overflow-y-auto sb-thin p-8" style={{ background: 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #f8fafc 100%)' }}>
                                    {!activeTab && !libraryFiles.length ? (
                                        /* Welcome screen */
                                        <div className="welcome-card anim-fade">
                                            <div className="p-4 bg-gradient-to-br from-indigo-100 to-purple-100 rounded-3xl inline-block mb-6">
                                                <Icon name="layers" size={56} className="text-indigo-600" />
                                            </div>
                                            <h2 className="text-gray-900">MD Learning Engine <span className="text-indigo-600">V3</span></h2>
                                            <p className="text-gray-500 mb-8 text-lg">Library Edition — Upload, Read, Share</p>

                                            <div className="bg-white rounded-2xl border-2 border-dashed border-indigo-200 p-8 mb-6 hover:border-indigo-400 transition-colors cursor-pointer" onClick={() => folderInputRef.current?.click()}>
                                                <Icon name="upload" size={40} className="text-indigo-400 mx-auto mb-3" />
                                                <p className="font-bold text-gray-800">Drop a folder here or click to choose</p>
                                                <p className="text-sm text-gray-400 mt-1">Scans all .md files recursively</p>
                                            </div>

                                            <div className="flex gap-3 justify-center flex-wrap">
                                                <button onClick={() => importInputRef.current?.click()} className="flex items-center gap-2 px-5 py-3 border-2 border-amber-200 rounded-xl text-sm font-bold text-amber-700 bg-amber-50 hover:bg-amber-100 transition-colors">
                                                    <Icon name="upload" size={18} />Import .mdlib.json
                                                </button>
                                            </div>

                                            <div className="mt-8 grid grid-cols-2 gap-3 text-left max-w-sm mx-auto">
                                                <div className="flex items-start gap-2 text-sm text-gray-600"><span className="text-lg">📂</span><span>Upload entire folders with subfolders</span></div>
                                                <div className="flex items-start gap-2 text-sm text-gray-600"><span className="text-lg">📑</span><span>Open multiple files in tabs</span></div>
                                                <div className="flex items-start gap-2 text-sm text-gray-600"><span className="text-lg">✅</span><span>Track viewed & unviewed files</span></div>
                                                <div className="flex items-start gap-2 text-sm text-gray-600"><span className="text-lg">💾</span><span>Export & import libraries</span></div>
                                            </div>
                                        </div>
                                    ) : !activeTab && libraryFiles.length > 0 ? (
                                        /* Library loaded but no file open */
                                        <div className="welcome-card anim-fade">
                                            <Icon name="book-open" size={48} className="text-indigo-400 mx-auto mb-4" />
                                            <h2 className="text-gray-900">{libraryName}</h2>
                                            <p className="text-gray-500 mb-4">{totalFiles} files loaded — {viewedCount} viewed</p>
                                            <p className="text-sm text-gray-400">Click a file in the sidebar to start reading</p>
                                        </div>
                                    ) : (
                                        <div data-preview>
                                            <ErrorBoundary>
                                                <DocumentRenderer doc={doc} globalView={globalView} />
                                            </ErrorBoundary>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
