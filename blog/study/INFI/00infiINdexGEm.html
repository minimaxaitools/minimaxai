    // REPLACE THE ENTIRE playBookmarks() METHOD
    // REPLACE ENTIRE playBookmarks() METHOD
    playBookmarks(onComplete = null) {
        console.log('playBookmarks called, onComplete:', onComplete ? 'YES' : 'NO'); // DEBUG

        if(this.bookmarks.length < 2) return alert("Need at least 2 bookmarks to play.");

        // Stop any existing playback
        this.stopBookmarks();

        // Show stop button, hide play button
        const playBtn = document.getElementById('play-bookmarks-btn');
        const stopBtn = document.getElementById('stop-bookmarks-btn');
        if (playBtn) playBtn.style.display = 'none';
        if (stopBtn) stopBtn.style.display = 'block';

        // Set flag to true
        this.isPlayingBookmarks = true;
        let currentIndex = 0;
        let visitedCount = 0; // ADDED: Track how many bookmarks visited

        // ADDED: Store completion callback
        this.onTourComplete = onComplete;

        console.log('Tour starting with', this.bookmarks.length, 'bookmarks'); // DEBUG

        const flyToNext = () => {
            // Check if stopped
            if (!this.isPlayingBookmarks) {
                console.log('Tour stopped by user'); // DEBUG
                this.stopBookmarks();
                return;
            }

            const bookmark = this.bookmarks[currentIndex];
            console.log('Flying to bookmark', currentIndex + 1, 'of', this.bookmarks.length); // DEBUG

            // Calculate intelligent duration
            const currentPos = this.camera.position;
            const targetPos = bookmark.position;
            const currentZoom = this.camera.zoom.toNumber();
            const targetZoom = new BigNumber(bookmark.zoom).toNumber();

            const dx = targetPos.x.minus(currentPos.x).abs().toNumber();
            const dy = targetPos.y.minus(currentPos.y).abs().toNumber();
            const distance = Math.sqrt(dx * dx + dy * dy);

            const zoomRatio = Math.max(currentZoom, targetZoom) / Math.min(currentZoom, targetZoom);
            const zoomFactor = Math.log10(Math.max(1, zoomRatio));

            let rotDiff = Math.abs(bookmark.rotation - this.camera.rotation);
            while (rotDiff > Math.PI) rotDiff = Math.abs(rotDiff - 2 * Math.PI);

            const distanceTime = Math.min(2, Math.log10(Math.max(1, distance * currentZoom)) * 0.5);
            const zoomTime = Math.min(2, zoomFactor * 0.8);
            const rotTime = Math.min(1, rotDiff * 0.5);

            let duration = 2 + distanceTime + zoomTime + rotTime;
            duration = Math.max(2, Math.min(6, duration));

            // Move to bookmark
            this.smoothMoveTo(bookmark.position, bookmark.zoom, bookmark.rotation, duration, () => {
                console.log('Arrived at bookmark', currentIndex + 1); // DEBUG

                // Check if stopped during transition
                if (!this.isPlayingBookmarks) {
                    console.log('Tour stopped during transition'); // DEBUG
                    this.stopBookmarks();
                    return;
                }

                // Increment visited count
                visitedCount++;
                console.log('Visited count:', visitedCount, '/', this.bookmarks.length); // DEBUG

                // Move to next bookmark index
                currentIndex = (currentIndex + 1) % this.bookmarks.length;

                // UPDATED: Check if we've completed full cycle
                if (visitedCount >= this.bookmarks.length) {
                    console.log('✓✓✓ TOUR COMPLETED! All', this.bookmarks.length, 'bookmarks visited'); // DEBUG

                    // Tour completed - call the callback
                    if (this.onTourComplete) {
                        console.log('Calling onTourComplete callback'); // DEBUG
                        const callback = this.onTourComplete;
                        this.onTourComplete = null; // Clear callback first
                        callback(); // Call it
                    }
                    return; // STOP - don't schedule next bookmark
                }

                // Wait before moving to next bookmark
                this.playInterval = setTimeout(() => {
                    if (!this.isPlayingBookmarks) {
                        console.log('Tour stopped before next bookmark'); // DEBUG
                        this.stopBookmarks();
                        return;
                    }
                    flyToNext(); // Continue to next bookmark
                }, 1500);
            });
        };

        // Start the sequence
        flyToNext();
    }





    // ADD THIS ENTIRE NEW METHOD AFTER playBookmarks()
    smoothFlyTo(targetPosition, targetZoom, targetRotation, duration, callback) {
        // ADDED: Disable default camera animation during flight
        // This method keeps the "fly-through" effect for manual navigation
        // (like clicking "Go To Object" or loading a single bookmark)

        this.camera.isAnimating = false;

        // Store original camera state
        const startPosition = this.camera.position.clone();

        const startZoom = this.camera.zoom;
        const startRotation = this.camera.rotation;

        const startTime = performance.now();

        // Calculate intermediate zoom point for "fly through" effect
        // We'll zoom out first, then zoom in
        const currentZoomNum = startZoom.toNumber();
        const targetZoomNum = new BigNumber(targetZoom).toNumber();
        const minZoom = Math.min(currentZoomNum, targetZoomNum) * 0.3; // Zoom out to 30% of minimum

        const animate = (currentTime) => {


            const elapsed = (currentTime - startTime) / 1000;
            let t = Math.min(elapsed / duration, 1);

            const ease = t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;

            // Fly-through zoom curve
            let zoomProgress;
            if (t < 0.5) {
                const phase = t * 2;
                zoomProgress = currentZoomNum + (minZoom - currentZoomNum) * (4 * phase * phase * phase);
            } else {
                const phase = (t - 0.5) * 2;
                zoomProgress = minZoom + (targetZoomNum - minZoom) * (4 * phase * phase * phase);
            }

            this.camera.position = BigVec2.lerp(startPosition, targetPosition, ease);
            this.camera.zoom = new BigNumber(zoomProgress);

            let rotDiff = targetRotation - startRotation;
            while (rotDiff > Math.PI) rotDiff -= 2 * Math.PI;
            while (rotDiff < -Math.PI) rotDiff += 2 * Math.PI;
            this.camera.rotation = startRotation + rotDiff * ease;

            this.camera.targetPosition = this.camera.position.clone();
            this.camera.targetZoom = this.camera.zoom;
            this.camera.targetRotation = this.camera.rotation;

            if (t < 1) {
                requestAnimationFrame(animate);
            } else {
                this.camera.position = targetPosition.clone();
                this.camera.zoom = new BigNumber(targetZoom);
                this.camera.rotation = targetRotation;
                this.camera.targetPosition = this.camera.position.clone();
                this.camera.targetZoom = this.camera.zoom;
                this.camera.targetRotation = this.camera.rotation;

                if (callback) callback();
            }
        };

        requestAnimationFrame(animate);
    }

// ADD THIS ENTIRE NEW METHOD - Place it after smoothFlyTo() method
    smoothMoveTo(targetPosition, targetZoom, targetRotation, duration, callback) {
        // Direct smooth interpolation - NO fly-through effect
        // Perfect for bookmark-to-bookmark transitions

        const startPosition = this.camera.position.clone();
        const startZoom = this.camera.zoom;
        const startRotation = this.camera.rotation;
        const startTime = performance.now();

        const animate = (currentTime) => {
            // Check if playback was stopped
            if (!this.isPlayingBookmarks && this.playInterval !== null) {
                if (callback) callback();
                return;
            }

            const elapsed = (currentTime - startTime) / 1000; // seconds
            let t = Math.min(elapsed / duration, 1);

            // Smooth ease-in-out cubic
            const ease = t < 0.5
                ? 4 * t * t * t
                : 1 - Math.pow(-2 * t + 2, 3) / 2;

            // DIRECT interpolation - no fancy zoom curves
            // Position
            this.camera.position = BigVec2.lerp(startPosition, targetPosition, ease);

            // Zoom - LINEAR interpolation in log space for smooth scaling
            const startLog = Math.log(startZoom.toNumber());
            const targetLog = Math.log(new BigNumber(targetZoom).toNumber());
            const currentLog = startLog + (targetLog - startLog) * ease;
            this.camera.zoom = new BigNumber(Math.exp(currentLog));

            // Rotation - shortest path
            let rotDiff = targetRotation - startRotation;
            while (rotDiff > Math.PI) rotDiff -= 2 * Math.PI;
            while (rotDiff < -Math.PI) rotDiff += 2 * Math.PI;
            this.camera.rotation = startRotation + rotDiff * ease;

            // Sync targets
            this.camera.targetPosition = this.camera.position.clone();
            this.camera.targetZoom = this.camera.zoom;
            this.camera.targetRotation = this.camera.rotation;

            if (t < 1) {
                requestAnimationFrame(animate);
            } else {
                // Ensure exact final values
                this.camera.position = targetPosition.clone();
                this.camera.zoom = new BigNumber(targetZoom);
                this.camera.rotation = targetRotation;
                this.camera.targetPosition = this.camera.position.clone();
                this.camera.targetZoom = this.camera.zoom;
                this.camera.targetRotation = this.camera.rotation;

                if (callback) {
                    console.log('smoothMoveTo complete, calling callback'); // ADD THIS
                    callback();
                }

            }
        };

        requestAnimationFrame(animate);
    }


    // UPDATED THE ENTIRE stopBookmarks() METHOD
    stopBookmarks() {
        console.log('stopBookmarks() called');
        // Set flag to false FIRST
        this.isPlayingBookmarks = false;

        // Clear any pending timeout
        if (this.playInterval) {
            clearTimeout(this.playInterval);
            this.playInterval = null;
        }

        // Update UI
        const playBtn = document.getElementById('play-bookmarks-btn');
        const stopBtn = document.getElementById('stop-bookmarks-btn');
        if (playBtn) playBtn.style.display = 'block';
        if (stopBtn) stopBtn.style.display = 'none';
    }

    // REPLACE THE ENTIRE exportToJSON() METHOD
    async exportToJSON() {
        // Show loading indicator
        const originalText = 'Exporting...';
        const loadingDiv = document.createElement('div');
        loadingDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:white;padding:20px 40px;border-radius:10px;z-index:1000;font-size:16px;';
        loadingDiv.textContent = originalText;
        document.body.appendChild(loadingDiv);

        try {
            const zip = new JSZip();

            // Prepare object data WITHOUT image data URLs
            const objectsData = [];

            for (const o of this.objects) {
                const objData = {
                    type: o.type,
                    name: o.name,
                    id: o.id,
                    pos: {x: o.position.x.toString(), y: o.position.y.toString()},
                    scale: o.scale.toString(),
                    rot: o.rotation,
                    visible: o.visible,
                    zIndex: o.zIndex
                };

                // Add type-specific data
                if (o.type === 'Text') {
                    objData.text = o.text;
                    objData.color = o.color;
                    objData.fontSize = o.fontSize;
                    objData.fontFamily = o.fontFamily;
                } else if (o.type === 'Image' || o.type === 'SVG') {
                    // UPDATED: Store reference to asset, not the data itself
                    objData.assetId = o.assetId;
                    objData.originalFilename = o.originalFilename;
                    objData.isSvg = o.isSvg;
                    objData.width = o.width;
                    objData.height = o.height;
                }

                objectsData.push(objData);
            }

            // Create project JSON
            const projectData = {
                version: '2.0',
                objects: objectsData,
                bookmarks: this.bookmarks.map(b => ({
                    name: b.name,
                    pos: {x: b.position.x.toString(), y: b.position.y.toString()},
                    zoom: b.zoom.toString(),
                    rot: b.rotation
                })),
                camera: {
                    pos: {x: this.camera.position.x.toString(), y: this.camera.position.y.toString()},
                    zoom: this.camera.zoom.toString(),
                    rot: this.camera.rotation
                }
            };

            // Add project JSON to ZIP
            zip.file('project.json', JSON.stringify(projectData, null, 2));

            // Add all assets from IndexedDB to ZIP
            const assets = await this.storage.getAllAssets();
            const assetsFolder = zip.folder('assets');

            loadingDiv.textContent = `Exporting... (0/${assets.length} assets)`;

            for (let i = 0; i < assets.length; i++) {
                const asset = assets[i];
                const ext = asset.type === 'svg' ? 'svg' :
                    (asset.filename ? asset.filename.split('.').pop() : 'png');
                const filename = `${asset.id}.${ext}`;
                assetsFolder.file(filename, asset.blob);

                loadingDiv.textContent = `Exporting... (${i + 1}/${assets.length} assets)`;
            }

            // Generate ZIP
            loadingDiv.textContent = 'Generating ZIP file...';
            const blob = await zip.generateAsync({
                type: 'blob',
                compression: 'DEFLATE',
                compressionOptions: { level: 6 }
            });

            // Download
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `infinite-canvas-project-${Date.now()}.zip`;
            a.click();
            URL.revokeObjectURL(url);

            loadingDiv.textContent = 'Export complete!';
            setTimeout(() => document.body.removeChild(loadingDiv), 1500);

        } catch (error) {
            console.error('Export error:', error);
            loadingDiv.textContent = 'Export failed: ' + error.message;
            loadingDiv.style.background = 'rgba(211, 47, 47, 0.9)';
            setTimeout(() => document.body.removeChild(loadingDiv), 3000);
        }
    }


    // ADD THIS ENTIRE NEW METHOD AFTER exportToJSON()
    async importFromZIP(file) {
        // Show loading indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.style.cssText = 'position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.9);color:white;padding:20px 40px;border-radius:10px;z-index:1000;font-size:16px;';
        loadingDiv.textContent = 'Loading project...';
        document.body.appendChild(loadingDiv);

        try {
            const zip = await JSZip.loadAsync(file);

            // Load project.json
            const projectFile = zip.file('project.json');
            if (!projectFile) {
                throw new Error('Invalid project file: missing project.json');
            }

            const projectJSON = await projectFile.async('string');
            const data = JSON.parse(projectJSON);

            // Clear current project
            this.objects = [];
            this.bookmarks = [];
            this.selectedObject = null;

            // Clear existing assets in IndexedDB (optional - comment out if you want to keep old assets)
            // await this.storage.clearAllAssets();

            // Load all assets from ZIP into IndexedDB
            const assetsFolder = zip.folder('assets');
            const assetFiles = [];
            assetsFolder.forEach((relativePath, file) => {
                assetFiles.push({ relativePath, file });
            });

            loadingDiv.textContent = `Loading assets... (0/${assetFiles.length})`;

            // Load assets into IndexedDB
            for (let i = 0; i < assetFiles.length; i++) {
                const { relativePath, file } = assetFiles[i];
                const blob = await file.async('blob');

                // Extract asset ID from filename (format: assetId.ext)
                const assetId = relativePath.split('.')[0];
                const isSvg = relativePath.endsWith('.svg');
                const type = isSvg ? 'svg' : 'image';

                await this.storage.saveAsset(assetId, blob, relativePath, type);

                loadingDiv.textContent = `Loading assets... (${i + 1}/${assetFiles.length})`;
            }

            // Restore objects
            loadingDiv.textContent = 'Restoring objects...';

            for (const objData of data.objects) {
                let obj;

                if (objData.type === 'Text') {
                    obj = new TextObject();
                    obj.text = objData.text || 'Text';
                    obj.color = objData.color || '#ffffff';
                    obj.fontSize = objData.fontSize || 24;
                    obj.fontFamily = objData.fontFamily || 'Arial';
                } else if (objData.type === 'Image' || objData.type === 'SVG') {
                    // CRITICAL: Load from IndexedDB
                    const asset = await this.storage.getAsset(objData.assetId);

                    if (asset && asset.blob) {
                        obj = new ImageObject(null, objData.isSvg, objData.assetId);
                        obj.originalFilename = objData.originalFilename || 'image';
                        obj.width = objData.width || 100;
                        obj.height = objData.height || 100;

                        // Load the blob into the image
                        obj.loadFromBlob(asset.blob);
                    } else {
                        console.warn(`Asset ${objData.assetId} not found, skipping object`);
                        continue;
                    }
                }

                // Restore common properties
                obj.id = objData.id;
                obj.name = objData.name;
                obj.position = new BigVec2(objData.pos.x, objData.pos.y);
                obj.scale = new BigNumber(objData.scale);
                obj.rotation = objData.rot;
                obj.visible = objData.visible !== false;
                obj.zIndex = objData.zIndex || 0;

                this.objects.push(obj);
            }

            // Restore bookmarks
            if (data.bookmarks) {
                this.bookmarks = data.bookmarks.map(b =>
                    new Bookmark(
                        b.name,
                        new BigVec2(b.pos.x, b.pos.y),
                        b.zoom,
                        b.rot
                    )
                );
            }

            // Restore camera position (optional)
            if (data.camera) {
                this.camera.position = new BigVec2(data.camera.pos.x, data.camera.pos.y);
                this.camera.zoom = new BigNumber(data.camera.zoom);
                this.camera.rotation = data.camera.rot;
                this.camera.targetPosition = this.camera.position.clone();
                this.camera.targetZoom = this.camera.zoom;
                this.camera.targetRotation = this.camera.rotation;
            }

            // Update UI
            this.updateObjectsList();
            this.updateBookmarksList();

            loadingDiv.textContent = 'Project loaded successfully!';
            loadingDiv.style.background = 'rgba(76, 175, 80, 0.9)';
            setTimeout(() => document.body.removeChild(loadingDiv), 2000);

        } catch (error) {
            console.error('Import error:', error);
            loadingDiv.textContent = 'Import failed: ' + error.message;
            loadingDiv.style.background = 'rgba(211, 47, 47, 0.9)';
            setTimeout(() => document.body.removeChild(loadingDiv), 3000);
        }
    }

    // Updated THE ENTIRE importFromJSON() METHOD
    async importFromJSON(json) {
        try {
            const data = JSON.parse(json);

            // Check if it's old format (version 1.0 or no version)
            if (!data.version || data.version === '1.0') {
                alert('This is an old format file. Images will not be restored. Please use ZIP export format for full project saves.');
            }

            this.objects = [];
            this.bookmarks = [];

            // Restore objects
            for (const d of data.objects) {
                let obj;

                if (d.type === 'Text') {
                    obj = new TextObject();
                    obj.text = d.text || 'Text';
                    obj.color = d.color || '#ffffff';
                    obj.fontSize = d.fontSize || 24;
                    obj.fontFamily = d.fontFamily || 'Arial';

                    obj.name = d.name;
                    obj.position = new BigVec2(d.pos.x, d.pos.y);
                    obj.scale = new BigNumber(d.scale);
                    obj.rotation = d.rot;

                    this.objects.push(obj);
                }
                // Note: Images/SVGs from old JSON format cannot be restored
            }

            // Restore bookmarks
            if (data.bookmarks) {
                this.bookmarks = data.bookmarks.map(b =>
                    new Bookmark(
                        b.name,
                        new BigVec2(b.pos.x, b.pos.y),
                        b.zoom,
                        b.rot
                    )
                );
            }

            this.updateObjectsList();
            this.updateBookmarksList();
            alert("Project Loaded (Text objects only from old format)");
        } catch(e) {
            alert("Error loading project: " + e.message);
            console.error(e);
        }
    }
