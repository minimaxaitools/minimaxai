<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MD Learning Engine V2 — Nested Interactive .md Renderer</title>
    <meta name="description"
        content="Transform markdown files into interactive learning experiences with 10 UI component types.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'], mono: ['JetBrains Mono', 'monospace'] } } } };
    </script>
    <style>
        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        @keyframes slideUp {
            from {
                transform: translateY(12px);
                opacity: 0
            }

            to {
                transform: translateY(0);
                opacity: 1
            }
        }

        @keyframes slideRight {
            from {
                transform: translateX(-12px);
                opacity: 0
            }

            to {
                transform: translateX(0);
                opacity: 1
            }
        }

        @keyframes pulseGlow {

            0%,
            100% {
                opacity: 0.4
            }

            50% {
                opacity: 1
            }
        }

        @keyframes shimmer {
            0% {
                background-position: -200% 0
            }

            100% {
                background-position: 200% 0
            }
        }

        .anim-fade {
            animation: fadeIn .4s ease-out both
        }

        .anim-up {
            animation: slideUp .4s ease-out both
        }

        .anim-right {
            animation: slideRight .4s ease-out both
        }

        .sb-hide::-webkit-scrollbar {
            display: none
        }

        .sb-hide {
            -ms-overflow-style: none;
            scrollbar-width: none
        }

        .sb-thin::-webkit-scrollbar {
            width: 5px
        }

        .sb-thin::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 9px
        }

        .line-clamp-1 {
            display: -webkit-box;
            -webkit-line-clamp: 1;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        .line-clamp-3 {
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden
        }

        /* Markdown rendered content */
        .md-body {
            font-size: 0.95rem;
            line-height: 1.75;
            color: #374151;
        }

        .md-body h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 1rem 0 0.5rem;
            color: #111827;
        }

        .md-body h2 {
            font-size: 1.25rem;
            font-weight: 700;
            margin: 0.8rem 0 0.4rem;
            color: #1f2937;
        }

        .md-body h3 {
            font-size: 1.1rem;
            font-weight: 700;
            margin: 0.6rem 0 0.3rem;
            color: #1f2937;
        }

        .md-body h4,
        .md-body h5,
        .md-body h6 {
            font-size: 1rem;
            font-weight: 600;
            margin: 0.5rem 0 0.25rem;
            color: #374151;
        }

        .md-body p {
            margin: 0.4rem 0;
        }

        .md-body ul,
        .md-body ol {
            padding-left: 1.5rem;
            margin: 0.4rem 0;
        }

        .md-body li {
            margin: 0.15rem 0;
        }

        .md-body ul {
            list-style: disc;
        }

        .md-body ol {
            list-style: decimal;
        }

        .md-body code {
            background: #f3f4f6;
            padding: 0.15rem 0.35rem;
            border-radius: 4px;
            font-size: 0.85em;
            font-family: 'JetBrains Mono', monospace;
            color: #6366f1;
        }

        .md-body pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1rem;
            border-radius: 0.75rem;
            overflow-x: auto;
            margin: 0.5rem 0;
        }

        .md-body pre code {
            background: transparent;
            color: inherit;
            padding: 0;
        }

        .md-body blockquote {
            border-left: 4px solid #6366f1;
            padding: 0.5rem 1rem;
            margin: 0.5rem 0;
            background: #f0f4ff;
            border-radius: 0 0.5rem 0.5rem 0;
            color: #4338ca;
        }

        .md-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 0.5rem 0;
            font-size: 0.9rem;
        }

        .md-body th {
            background: #f1f5f9;
            font-weight: 700;
            text-align: left;
            padding: 0.5rem 0.75rem;
            border: 1px solid #e2e8f0;
        }

        .md-body td {
            padding: 0.5rem 0.75rem;
            border: 1px solid #e2e8f0;
        }

        .md-body hr {
            border: none;
            border-top: 2px solid #e5e7eb;
            margin: 0.75rem 0;
        }

        .md-body a {
            color: #2563eb;
            text-decoration: underline;
        }

        .md-body strong {
            font-weight: 700;
            color: #111827;
        }

        .md-body em {
            font-style: italic;
        }

        .md-body img {
            max-width: 100%;
            border-radius: 0.5rem;
            margin: 0.5rem 0;
        }

        .md-body-sm {
            font-size: 0.85rem;
            line-height: 1.6;
        }

        .md-body-sm h1 {
            font-size: 1.15rem;
        }

        .md-body-sm h2 {
            font-size: 1.05rem;
        }

        .md-body-sm h3 {
            font-size: 0.95rem;
        }

        .md-body-sm p {
            margin: 0.25rem 0;
        }

        .md-body-dark {
            color: #d1d5db;
        }

        .md-body-dark h1,
        .md-body-dark h2,
        .md-body-dark h3,
        .md-body-dark strong {
            color: #f3f4f6;
        }

        .md-body-dark code {
            background: rgba(255, 255, 255, 0.1);
            color: #a5b4fc;
        }

        .md-body-dark blockquote {
            background: rgba(255, 255, 255, 0.05);
            border-left-color: #818cf8;
            color: #c7d2fe;
        }

        .md-body-dark a {
            color: #93c5fd;
        }

        /* Task list checkboxes */
        .md-body input[type="checkbox"] {
            margin-right: 0.4rem;
            accent-color: #6366f1;
        }

        .md-body .task-list-item {
            list-style: none;
            margin-left: -1.2rem;
        }

        /* Component block wrapper */
        .comp-block {
            position: relative;
            margin: 1.25rem 0;
            border-radius: 1rem;
        }

        .comp-badge {
            position: absolute;
            top: -10px;
            right: 12px;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 2px 10px;
            border-radius: 6px;
            z-index: 5;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useCallback, useMemo, useRef } = React;

        /* ═══════════════════════════════════════════
           ICONS
           ═══════════════════════════════════════════ */
        const IP = {
            code: '<polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/>',
            eye: '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
            layout: '<rect x="3" y="3" width="18" height="18" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="9" y1="21" x2="9" y2="9"/>',
            grid: '<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>',
            list: '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
            edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>',
            'chevron-down': '<polyline points="6 9 12 15 18 9"/>',
            'chevron-up': '<polyline points="18 15 12 9 6 15"/>',
            'chevron-left': '<polyline points="15 18 9 12 15 6"/>',
            'chevron-right': '<polyline points="9 18 15 12 9 6"/>',
            'check-circle': '<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>',
            'alert-circle': '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
            info: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
            search: '<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
            upload: '<polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/>',
            download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>',
            copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
            'refresh-cw': '<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>',
            sparkles: '<path d="M12 3l1.912 5.813a2 2 0 0 0 1.275 1.275L21 12l-5.813 1.912a2 2 0 0 0-1.275 1.275L12 21l-1.912-5.813a2 2 0 0 0-1.275-1.275L3 12l5.813-1.912a2 2 0 0 0 1.275-1.275L12 3z"/>',
            'file-text': '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/>',
            'folder-open': '<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
            zap: '<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
            'book-open': '<path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>',
            brain: '<path d="M9.5 2A5.5 5.5 0 0 0 4 7.5c0 1.58.68 3 1.76 4L12 19l6.24-7.5A5.5 5.5 0 0 0 14.5 2a5.5 5.5 0 0 0-5 0z"/>',
            filter: '<polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/>',
            globe: '<circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>',
            layers: '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
        };
        const Icon = ({ name, size = 20, className = '' }) => {
            const d = IP[name]; if (!d) return null;
            return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: d }} />;
        };

        /* ═══════════════════════════════════════════
           MARKDOWN HELPERS
           ═══════════════════════════════════════════ */
        const renderMd = (text) => { try { return marked.parse(text || '', { breaks: true, gfm: true }); } catch (e) { return text || ''; } };
        const MdContent = ({ text, className = '', small = false, dark = false }) => (
            <div className={`md-body ${small ? 'md-body-sm' : ''} ${dark ? 'md-body-dark' : ''} ${className}`} dangerouslySetInnerHTML={{ __html: renderMd(text) }} />
        );

        /* ═══════════════════════════════════════════
           PARSER — .md → AST
           ═══════════════════════════════════════════ */
        const parseProps = (str) => {
            if (!str || !str.startsWith('{')) return {};
            try { return JSON.parse(str); } catch (e) {
                const props = {};
                const re = /(\w+)\s*[=:]\s*(?:"([^"]*)"|'([^']*)'|(\S+))/g; let m;
                while ((m = re.exec(str)) !== null) {
                    const val = m[2] ?? m[3] ?? m[4];
                    props[m[1]] = /^\d+$/.test(val) ? parseInt(val) : val === 'true' ? true : val === 'false' ? false : val;
                }
                return props;
            }
        };

        /* ── Section splitters (now children-aware) ── */
        const parseSections = (lines, children, marker) => {
            const sections = []; let cur = null;
            for (const line of lines) {
                const m = line.match(new RegExp(`^${marker}\\s+(.+)$`));
                if (m) { if (cur) sections.push(cur); cur = { title: m[1].trim(), lines: [] }; }
                else if (cur) cur.lines.push(line);
                else if (line.trim()) { cur = { title: '', lines: [line] }; }
            }
            if (cur) sections.push(cur);
            /* Distribute child blocks into their nearest preceding section */
            const result = sections.map(s => ({ title: s.title, content: s.lines.join('\n').trim(), children: [] }));
            if (children && children.length && result.length) {
                /* Simple heuristic: child order maps to section order.
                   We assign each child to the section whose raw-line range it was within.
                   Since we lost exact line positions, just append all children to the last section
                   that existed before them. We use a positional index approach. */
                let lineCount = 0; const sectionEnds = [];
                for (const s of sections) { lineCount += s.lines.length + 1; sectionEnds.push(lineCount); }
                /* Simpler: assign children round-robin to sections they appear after.
                   Since children were extracted in order, and the raw lines between them
                   define sections, we distribute children based on insertion order. */
                children.forEach(c => {
                    result[result.length - 1].children.push(c);
                });
            }
            return result;
        };

        const parseRadio = (props, lines) => {
            const questionLines = []; const options = [];
            for (const line of lines) {
                const m = line.match(/^\(([A-Za-z0-9])\)\s+(.+)$/);
                if (m) options.push({ label: m[1], text: m[2].trim() });
                else if (line.trim()) questionLines.push(line);
            }
            return { type: 'radio', props, question: questionLines.join('\n').trim(), options };
        };

        const parseCarousel = (lines) => {
            const slides = []; let cur = null;
            for (const line of lines) {
                if (/^---\s*[Ss]lide/.test(line) || /^@slide\s*/i.test(line)) {
                    if (cur) slides.push(cur);
                    cur = { title: line.replace(/^---\s*[Ss]lide\s*/, '').replace(/^@slide\s*/i, '').trim() || '', lines: [] };
                } else if (cur) cur.lines.push(line);
                else { cur = { title: '', lines: [line] }; }
            }
            if (cur) slides.push(cur);
            return slides.map(s => ({ title: s.title || s.lines[0]?.trim() || '', content: s.lines.join('\n').trim() }));
        };

        const parseBento = (lines) => {
            const cards = []; let cur = null;
            for (const line of lines) {
                const m = line.match(/^@card\s+(?:Title:\s*)?(.+)$/i);
                if (m) { if (cur) cards.push(cur); cur = { title: m[1].trim(), lines: [] }; }
                else if (cur) cur.lines.push(line);
            }
            if (cur) cards.push(cur);
            return cards.map(c => ({ title: c.title, content: c.lines.join('\n').trim(), children: [] }));
        };

        const parseDirective = (type, props, rawLines, children) => {
            const ch = children || [];
            switch (type) {
                case 'tabs': return { type, props, items: parseSections(rawLines, ch, '@tab'), children: ch };
                case 'accordion': return { type, props, items: parseSections(rawLines, ch, '@item'), children: ch };
                case 'chips': return { type, props, items: rawLines.map(l => l.trim()).filter(Boolean), children: ch };
                case 'radio': { const r = parseRadio(props, rawLines); r.children = ch; return r; }
                case 'snackbar': return { type, props, content: rawLines.join('\n').trim(), children: ch };
                case 'toast': return { type, props, content: rawLines.join('\n').trim(), children: ch };
                case 'carousel': return { type, props, items: parseCarousel(rawLines), children: ch };
                case 'bento': return { type, props, items: parseBento(rawLines), children: ch };
                case 'breadcrumbs': return { type, props, path: rawLines.join('').split('>').map(s => s.trim()).filter(Boolean), children: ch };
                case 'skeleton': return { type, props: { lines: props.lines || 4, ...props }, children: ch };
                default: return { type: 'markdown', content: rawLines.join('\n'), children: ch };
            }
        };

        /* ═══════════════════════════════════════════
           RECURSIVE PARSER — supports nested :::directives
           :::componentName = OPEN, bare ::: = CLOSE
           ═══════════════════════════════════════════ */
        const collectBlocks = (lines, startIdx, isNested) => {
            const blocks = []; let mdBuf = []; let i = startIdx;
            const flushMd = () => { const c = mdBuf.join('\n').trim(); if (c) blocks.push({ type: 'markdown', content: c, children: [] }); mdBuf = []; };
            while (i < lines.length) {
                const line = lines[i];
                /* Bare ::: → close current nesting level */
                if (/^:::\s*$/.test(line)) {
                    if (isNested) { flushMd(); i++; break; }
                    else { mdBuf.push(line); i++; continue; } /* stray ::: at top level → treat as text */
                }
                /* :::type → open a new directive (possibly nested) */
                const dm = line.match(/^:::(\w[\w-]*)\s*(.*)?$/);
                if (dm && dm[1]) {
                    flushMd();
                    const compType = dm[1].toLowerCase();
                    const propsStr = (dm[2] || '').trim();
                    i++;
                    /* Recursively collect inner content — may contain more :::directives */
                    const inner = collectBlocks(lines, i, true);
                    i = inner.endIdx;
                    /* Separate raw text lines from nested directive children */
                    const rawLines = []; const childBlocks = [];
                    inner.blocks.forEach(b => {
                        if (b.type === 'markdown') { rawLines.push(...b.content.split('\n')); }
                        else { childBlocks.push(b); }
                    });
                    blocks.push(parseDirective(compType, parseProps(propsStr), rawLines, childBlocks));
                } else {
                    mdBuf.push(line); i++;
                }
            }
            flushMd();
            return { blocks, endIdx: i };
        };

        const parseDoc = (text) => {
            const result = { meta: {}, blocks: [] };
            const fmMatch = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
            if (fmMatch) {
                fmMatch[1].split('\n').forEach(line => {
                    const idx = line.indexOf(':');
                    if (idx > 0) {
                        const key = line.slice(0, idx).trim();
                        let val = line.slice(idx + 1).trim();
                        if (val.startsWith('[') && val.endsWith(']')) val = val.slice(1, -1).split(',').map(s => s.trim().replace(/^["']|["']$/g, ''));
                        else if (val === 'true') val = true;
                        else if (val === 'false') val = false;
                        else if (/^\d+$/.test(val)) val = parseInt(val);
                        else val = val.replace(/^["']|["']$/g, '');
                        result.meta[key] = val;
                    }
                });
                text = fmMatch[2] || '';
            }
            const allLines = text.split('\n');
            const parsed = collectBlocks(allLines, 0, false);
            result.blocks = parsed.blocks;
            return result;
        };

        /* ═══════════════════════════════════════════
           NORMALIZE — convert any block to items[]
           ═══════════════════════════════════════════ */
        const normalizeBlock = (block) => {
            switch (block.type) {
                case 'tabs': case 'accordion': case 'carousel': case 'bento': return block.items || [];
                case 'chips': return (block.items || []).map(c => ({ title: c, content: '' }));
                case 'radio': return (block.options || []).map(o => ({ title: `(${o.label}) ${o.text}`, content: block.question || '' }));
                case 'snackbar': case 'toast': return [{ title: block.props?.type || block.type, content: block.content || '' }];
                case 'breadcrumbs': return (block.path || []).map(p => ({ title: p, content: '' }));
                case 'skeleton': return Array(block.props?.lines || 3).fill(null).map((_, i) => ({ title: `Section ${i + 1}`, content: '...' }));
                default: return [{ title: '', content: block.content || '' }];
            }
        };

        /* ═══════════════════════════════════════════
           RENDERERS — All 10 component types
           ═══════════════════════════════════════════ */

        const TabsBlock = ({ items }) => {
            const [active, setActive] = useState(0);
            const cur = items[active] || items[0];
            return (
                <div className="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
                    <div className="flex overflow-x-auto border-b border-gray-200 bg-gray-50 sb-hide">
                        {items.map((item, i) => (
                            <button key={i} onClick={() => setActive(i)} className={`whitespace-nowrap px-5 py-3 text-sm font-bold border-b-2 transition-colors ${active === i ? 'border-blue-600 text-blue-700 bg-white' : 'border-transparent text-gray-500 hover:text-gray-700 hover:bg-gray-100'}`}>
                                {item.title || `Tab ${i + 1}`}
                            </button>
                        ))}
                    </div>
                    <div className="p-6 anim-fade" key={active}>
                        {cur?.title && <h3 className="text-xl font-bold text-gray-900 mb-3">{cur.title}</h3>}

# 📚 The Mughal Empire (1526–1857)

The Mughal Empire was one of the largest and most powerful empires in Indian history. Founded by **Babur** in 1526, it dominated the Indian subcontinent for over three centuries.

:::tabs

The Mughal Empire was established after the **Battle of Panipat** in 1526, when Babur defeated Ibrahim Lodi.

- Centralized administration
- Cultural synthesis of Persian, Turkic, and Indian traditions
- Remarkable architectural achievements

## 📖 Deep Dive: Administration

:::accordion
@item What was the Mansabdari System?
The **Mansabdari system** was a ranking system introduced by Akbar to organize the military and civil services.

- Each officer (*mansabdar*) was assigned a rank
- Ranks determined **salary** and number of cavalry
- Dual ranking: *zat* (personal) and *sawar* (cavalry)

> This system ensured loyalty to the emperor and efficient administration.

@item What was Din-i-Ilahi?
**Din-i-Ilahi** (Faith of God) was a syncretic religion founded by Akbar in 1582.

Key principles:
1. Universal tolerance
2. Combined elements of Islam, Hinduism, Christianity, and Zoroastrianism
3. \`Sulh-i-kul\` — peace with all

@item Revenue System
Akbar's revenue system called **Zabt** was introduced by Raja Todar Mal:

\`\`\`
Land Revenue = 1/3 of produce
Measured in: Bigha (unit of area)
Collection: Cash or kind
\`\`\`
:::

## 🎠 Key Battles

:::carousel
--- Slide
### ⚔️ First Battle of Panipat (1526)
**Babur** vs **Ibrahim Lodi**

Babur used *tulughma* (flanking) tactics and **gunpowder artillery** — a first in Indian warfare.

--- Slide
### ⚔️ Battle of Khanwa (1527)
**Babur** vs **Rana Sanga**

Decisive victory that established Mughal dominance over Rajput resistance.

--- Slide
### ⚔️ Battle of Haldighati (1576)
**Akbar's forces** vs **Maharana Pratap**

Though Pratap lost, he continued guerrilla warfare and never surrendered.

--- Slide
### ⚔️ Battle of Plassey (1757)
**British East India Company** vs **Siraj-ud-Daulah**

Marked the beginning of British colonial rule and the decline of Mughal authority.
:::

                const styles = document.querySelectorAll('style, link[rel=stylesheet]');
                let styleStr = '';
                styles.forEach(s => { if (s.tagName === 'STYLE') styleStr += s.outerHTML; });
                const htmlContent = `<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>${doc.meta.title || 'Interactive Study Notes'}</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"><\/script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','sans-serif'],mono:['JetBrains Mono','monospace']}}}};<\/script>
${styleStr}
<style>body{font-family:'Inter',system-ui,sans-serif;background:linear-gradient(135deg,#f8fafc 0%,#f1f5f9 50%,#f8fafc 100%);min-height:100vh;padding:2rem;}
.export-badge{display:inline-block;font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:2px 10px;border-radius:6px;margin-bottom:0.5rem;}
</style></head><body>
<div style="max-width:56rem;margin:0 auto;">${previewEl.innerHTML}</div>
</body></html>`;
                const blob = new Blob([htmlContent], { type: 'text/html' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = (doc.meta.title || 'interactive-notes').replace(/[^a-zA-Z0-9]/g, '_') + '.html';
                a.click();
                URL.revokeObjectURL(url);
            };

            /* ── Export: PDF (expanded view) ── */
            const exportPDF = async () => {
                const previewEl = document.querySelector('[data-preview]');
                if (!previewEl) return;
                /* Expand all accordions & show all tabs before capture */
                const clone = previewEl.cloneNode(true);
                /* Remove hidden accordion/tab content */
                clone.querySelectorAll('button').forEach(btn => {
                    btn.style.pointerEvents = 'none';
                });
                /* Create a temporary container */
                const container = document.createElement('div');
                container.style.cssText = 'position:fixed;top:0;left:0;width:800px;padding:32px;background:white;z-index:99999;overflow:visible;';
                container.innerHTML = `<div style="max-width:700px;margin:0 auto;font-family:Inter,system-ui,sans-serif;">${clone.innerHTML}</div>`;
                document.body.appendChild(container);
                try {
                    await html2pdf().set({
                        margin: [10, 10, 10, 10],
                        filename: (doc.meta.title || 'study-notes').replace(/[^a-zA-Z0-9]/g, '_') + '.pdf',
                        image: { type: 'jpeg', quality: 0.98 },
                        html2canvas: { scale: 2, useCORS: true, logging: false },
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
                        pagebreak: { mode: ['avoid-all', 'css', 'legacy'] }
                    }).from(container).save();
                } finally {
                    document.body.removeChild(container);
                }
            };

            const blockCounts = useMemo(() => {
                const counts = {};
                doc.blocks.forEach(b => { if (b.type !== 'markdown') counts[b.type] = (counts[b.type] || 0) + 1; });
                return counts;
            }, [doc]);

            return (
                <div className="min-h-screen bg-gray-50 font-sans flex flex-col">
                    {/* Header */}
                    <header className="bg-white border-b border-gray-200 sticky top-0 z-50 shadow-sm">
                        <div className="max-w-[1600px] mx-auto px-4 py-3 flex items-center gap-4 flex-wrap">
                            <div className="flex items-center gap-2.5">
                                <div className="p-2 bg-gradient-to-br from-indigo-600 to-purple-600 rounded-xl text-white"><Icon name="book-open" size={22} /></div>
                                <div>
                                    <h1 className="text-lg font-black text-gray-900 leading-tight">MD Learning Engine <span className="text-indigo-500">V2</span></h1>
                                    <p className="text-xs text-gray-500">Nested Interactive Markdown Renderer</p>
                                </div>
                            </div>

                            <div className="flex items-center gap-2 ml-auto flex-wrap">
                                {/* Global View Switcher */}
                                <select value={globalView || ''} onChange={e => setGlobalView(e.target.value || null)} className="px-3 py-2 border border-gray-200 rounded-xl text-sm font-medium bg-white hover:border-blue-400 focus:ring-2 focus:ring-blue-500 outline-none">
                                    {VIEW_TYPES.map(v => <option key={v.id || 'native'} value={v.id || ''}>{v.label}</option>)}
                                </select>

                                <button onClick={() => setShowEditor(!showEditor)} className={`p-2 rounded-xl border transition-colors ${showEditor ? 'bg-blue-50 border-blue-200 text-blue-600' : 'bg-white border-gray-200 text-gray-500 hover:text-gray-700'}`} title="Toggle Editor">
                                    <Icon name="edit" size={18} />
                                </button>

                                <div className="w-px h-6 bg-gray-200" />

                                <input ref={fileRef} type="file" accept=".md,.markdown,.txt" onChange={loadFile} className="hidden" />
                                <button onClick={() => fileRef.current?.click()} className="flex items-center gap-1.5 px-3 py-2 border border-gray-200 rounded-xl text-sm font-medium text-gray-700 bg-white hover:bg-gray-50 transition-colors">
                                    <Icon name="upload" size={16} />Load .md
                                </button>
                                <button onClick={downloadMd} className="p-2 rounded-xl border border-gray-200 text-gray-500 hover:text-gray-700 bg-white hover:bg-gray-50 transition-colors" title="Download"><Icon name="download" size={18} /></button>
                                <button onClick={copyMd} className="p-2 rounded-xl border border-gray-200 text-gray-500 hover:text-gray-700 bg-white hover:bg-gray-50 transition-colors" title="Copy"><Icon name="copy" size={18} /></button>
                                <button onClick={resetMd} className="p-2 rounded-xl border border-gray-200 text-gray-500 hover:text-gray-700 bg-white hover:bg-gray-50 transition-colors" title="Reset"><Icon name="refresh-cw" size={18} /></button>

                                <div className="w-px h-6 bg-gray-200" />

                                <button onClick={exportHTML} className="flex items-center gap-1.5 px-3 py-2 border border-emerald-200 rounded-xl text-sm font-medium text-emerald-700 bg-emerald-50 hover:bg-emerald-100 transition-colors" title="Export as interactive HTML">
                                    <Icon name="globe" size={16} />HTML
                                </button>
                                <button onClick={exportPDF} className="flex items-center gap-1.5 px-3 py-2 border border-rose-200 rounded-xl text-sm font-medium text-rose-700 bg-rose-50 hover:bg-rose-100 transition-colors" title="Export as PDF">
                                    <Icon name="file-text" size={16} />PDF
                                </button>
                            </div>
                        </div>
                    </header>

                    {/* Stats Bar */}
                    <div className="bg-white border-b border-gray-100 px-4 py-2">
                        <div className="max-w-[1600px] mx-auto flex items-center gap-3 text-xs overflow-x-auto sb-hide">
                            <span className="text-gray-400 font-medium flex-shrink-0">{doc.blocks.length} blocks</span>
                            <span className="text-gray-300">|</span>
                            {Object.entries(blockCounts).map(([type, count]) => (
                                <span key={type} className={`px-2 py-0.5 rounded-full font-bold flex-shrink-0 ${COMP_COLORS[type] || 'bg-gray-100 text-gray-600'}`}>
                                    {COMP_LABELS[type]} × {count}
                                </span>
                            ))}
                            {globalView && <span className="ml-auto px-2 py-0.5 bg-purple-100 text-purple-700 rounded-full font-bold flex-shrink-0">🔀 Global: {COMP_LABELS[globalView]}</span>}
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 flex overflow-hidden">
                        {/* Editor Panel */}
                        {showEditor && (
                            <div className="w-[420px] flex-shrink-0 border-r border-gray-200 bg-white flex flex-col">
                                <div className="p-3 border-b border-gray-100 flex items-center justify-between">
                                    <h3 className="text-sm font-bold text-gray-700 flex items-center gap-2"><Icon name="code" size={16} />Markdown Editor</h3>
                                    <button onClick={commitEditor} className="px-3 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg hover:bg-blue-700 transition-colors flex items-center gap-1">
                                        <Icon name="eye" size={14} />Preview
                                    </button>
                                </div>
                                <textarea
                                    value={editorText}
                                    onChange={e => setEditorText(e.target.value)}
                                    onBlur={commitEditor}
                                    className="flex-1 p-4 text-sm font-mono text-gray-800 leading-relaxed resize-none outline-none bg-gray-50"
                                    placeholder="Paste your .md content here..."
                                    spellCheck={false}
                                />
                            </div>
                        )}

                        {/* Preview Panel */}
                        <div className="flex-1 overflow-y-auto sb-thin p-8" style={{ background: 'linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #f8fafc 100%)' }}>
                            <div data-preview>
                                <ErrorBoundary>
                                    <DocumentRenderer doc={doc} globalView={globalView} />
                                </ErrorBoundary>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>

</html>
